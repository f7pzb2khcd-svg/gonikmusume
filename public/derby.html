<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고닉 무스메 Gonik Musume</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c3e50; padding: 20px 0; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; overflow-x: hidden; }
        h1 { text-align: center; margin-bottom: 5px; }
        .desc { font-size: 13px; color: #aaa; margin-bottom: 15px; text-align: center; }
        
        #lobby-panel { width: 90%; max-width: 600px; background-color: #fff; color: #000; border-radius: 10px; padding: 30px; box-sizing: border-box; text-align: center; margin-top: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #lobby-panel input, #lobby-panel select { width: 80%; padding: 12px; font-size: 16px; margin: 10px 0; border: 2px solid #ccc; border-radius: 5px; }
        
        #countdown-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        #countdown-text { font-size: 80px; font-weight: bold; color: #ffeb3b; text-shadow: 0 0 20px #ff9800; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
        #countdown-info { font-size: 18px; color: #ccc; margin-bottom: 10px; }

        #game-scale-wrapper { width: 900px; transform-origin: top center; display: none; flex-direction: column; align-items: center; transition: transform 0.2s; }
        
        #minimap-container { width: 100%; height: 60px; background-color: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 10px; margin-bottom: 10px; position: relative; overflow: hidden; }
        #minimap-viewport { position: absolute; top: 0; height: 100%; width: 20%; border: 2px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.2); box-sizing: border-box; z-index: 3; pointer-events: none; }
        .minimap-dot { position: absolute; width: 14px; height: 14px; background-color: #fff; border: 2px solid #000; border-radius: 50%; z-index: 5; font-size: 9px; color: black; font-weight: bold; text-align: center; line-height: 12px; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); transition: left 0.1s linear; }
        .skill-active { background-color: #00e5ff !important; box-shadow: 0 0 10px 4px #00e5ff !important; z-index: 6; }
        .ult-active { background-color: #ffeb3b !important; box-shadow: 0 0 15px 5px #ff5722 !important; z-index: 7; transform: scale(1.3); }

        #game-window { position: relative; width: 100%; height: 450px; background-color: #55a630; border: 4px solid #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #track { position: absolute; left: 0; top: 0; width: 10000px; height: 100%; background-image: repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255,255,255,0.1) 100px, rgba(255,255,255,0.1) 102px); }
        .start-line { position: absolute; left: 280px; top: 0; bottom: 0; width: 8px; background: repeating-linear-gradient(to bottom, white, white 10px, transparent 10px, transparent 20px); z-index: 1; }
        .obstacle-zone { position: absolute; left: 3500px; width: 1500px; height: 100%; background-color: rgba(255, 0, 0, 0.2); z-index: 0; border-left: 2px dashed red; border-right: 2px dashed red; }
        .obstacle-label { position: absolute; left: 3510px; top: 10px; color: #ff5555; font-weight: bold; font-size: 20px; z-index: 1; text-shadow: 1px 1px 2px black; }
        .finish-line { position: absolute; left: 9800px; top: 0; bottom: 0; width: 20px; background: repeating-linear-gradient(to bottom, white, white 20px, black 20px, black 40px); z-index: 1; }
        
        /* 🎨 주자 컨테이너 및 2D 스프라이트 설정 */
        .runner-container { position: absolute; width: 50px; height: 50px; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        
        .runner-name-tag { font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 4px; position: absolute; top: -15px; white-space: nowrap; z-index: 3; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        /* 캐릭터 이미지 클래스 */
        .runner-sprite { width: 100%; height: 100%; background-image: url('runner.png'); background-size: contain; background-repeat: no-repeat; background-position: bottom center; z-index: 2; }
        
        /* 🏃‍♂️ 달리기 애니메이션: 좌우로 흔들며 위아래로 뽈뽈뽈 */
        @keyframes runWiggle {
            0% { transform: translateY(0px) rotate(-12deg); }
            100% { transform: translateY(-8px) rotate(12deg); }
        }
        
        .stamina-bar-bg { position: absolute; bottom: -8px; width: 80%; height: 5px; background-color: #333; border-radius: 3px; overflow: hidden; border: 1px solid #fff; z-index: 3; }
        .stamina-bar-fill { width: 100%; height: 100%; background-color: #00ff00; }
        
        /* 스턴(기절) 시 애니메이션 멈추고 거무튀튀하게 */
        .stunned-sprite { filter: grayscale(100%) brightness(50%) !important; animation-play-state: paused !important; transform: rotate(-20deg) translateY(10px) !important; }
        .immune-sprite { opacity: 0.5; }

        .cutin { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #ult-cutin { background: rgba(50,0,0,0.8); }
        #ult-cutin-bg { width: 100%; background: linear-gradient(90deg, transparent, #e53935, transparent); padding: 40px 0; border-top: 2px solid #ffeb3b; border-bottom: 2px solid #ffeb3b; }
        .cutin-title { font-size: 30px; font-weight: bold; color: white; text-shadow: 2px 2px 4px #000; margin-bottom: 10px; }
        .cutin-name { font-size: 45px; font-weight: 900; color: #ffe082; text-shadow: 3px 3px 5px #000; }

        #commentary-board { width: 100%; height: 120px; background-color: #fff; color: #000; border: 3px solid #333; border-radius: 8px; margin-top: 10px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .msg-line { font-size: 14px; color: #888; margin-top: 4px; transition: all 0.3s ease; }
        .msg-line.latest { font-size: 18px; font-weight: bold; color: #000; }
        .msg-line .icon { color: #e53935; }

        button { padding: 12px 25px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #ff9800; color: white; border: none; border-radius: 8px; transition: 0.2s; }
        button:hover { background-color: #e68a00; transform: scale(1.05); }
        
        #debug-panel { width: 100%; background-color: #fff; color: #000; border-radius: 8px; padding: 15px; box-sizing: border-box; font-size: 13px; margin-top: 15px; margin-bottom: 30px; }
        #debug-panel h3 { margin-top: 0; color: #d32f2f; text-align: center; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { border: 1px solid #ccc; padding: 6px; }
        th { background-color: #eee; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🐎 고닉 무스메 Gonik Musume</h1>
    
    <div id="lobby-panel">
        <h2>🏆 새로운 대회 개최하기</h2>
        <input type="text" id="dcUrl" placeholder="https://gall.dcinside.com/board/view/?id=...">
        <select id="delaySelect">
            <option value="15">테스트용 (15초 뒤 시작)</option>
            <option value="60">1분 뒤 시작</option>
        </select>
        <br><br>
        <button onclick="createRoom()" id="createBtn">대회 방 생성하기</button>
        <div id="lobby-status" style="margin-top: 15px; color: #e53935; font-weight: bold;"></div>
    </div>

    <div id="countdown-overlay">
        <div id="countdown-info">데이터 로딩 완료. 참가자 입장 중...</div>
        <div id="countdown-text">00:00</div>
    </div>

    <div id="game-scale-wrapper">
        <div id="minimap-container">
            <div id="minimap-viewport"></div>
        </div>

        <div id="game-window">
            <div id="track">
                <div class="start-line"></div>
                <div class="obstacle-zone"></div>
                <div class="obstacle-label">🚧 위험 지대 🚧</div>
                <div class="finish-line"></div>
            </div>
            
            <div id="ult-cutin" class="cutin">
                <div id="ult-cutin-bg">
                    <div class="cutin-title" style="color:#ffeb3b;">🔥 [각성! 궁극기 발동!] 🔥</div>
                    <div id="ult-user" class="cutin-name" style="color:#fff;">닉네임</div>
                </div>
            </div>
        </div>

        <div id="commentary-board">
            <div class="msg-line latest"><span class="icon">▶</span> 선수들 게이트 진입 대기 중...</div>
        </div>

        <div id="debug-panel">
            <h3>📊 출전 선수 스탯 분석</h3>
            <table>
                <thead>
                    <tr>
                        <th>닉네임</th>
                        <th>컨디션</th>
                        <th>스피드</th>
                        <th>스태미나</th>
                        <th>파워</th>
                        <th>근성</th>
                        <th>지능</th>
                        <th>각질</th>
                    </tr>
                </thead>
                <tbody id="debug-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 백엔드 API (Render 서버 주소)
        const API_BASE = "https://gonik-musume.onrender.com/api"; 
        
        let seededRandom = Math.random; 
        function xmur3(str) {
            for(var i = 0, h = 1779033703 ^ str.length; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
                h = h << 13 | h >>> 19;
            }
            return function() {
                h = Math.imul(h ^ h >>> 16, 2246822507);
                h = Math.imul(h ^ h >>> 13, 3266489909);
                return (h ^= h >>> 16) >>> 0;
            }
        }
        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function resizeGame() {
            const wrapper = document.getElementById('game-scale-wrapper');
            if (wrapper.style.display !== 'none') {
                const scale = Math.min(window.innerWidth / 940, 1);
                wrapper.style.transform = `scale(${scale})`;
            }
        }
        window.addEventListener('resize', resizeGame);

        const TICK_RATE = 60; 
        const TICK_DT = 1.0 / TICK_RATE; 
        const TICK_MS = 1000 / TICK_RATE;
        let accumulator = 0;
        let lastRealTime = 0;
        let gameTime = 0; 

        let roomData = null;
        let runners = [];
        let isRacing = false;
        let isPaused = false;
        let raceEnded = false;
        
        let lastSkillTime = -10;
        let ultimateUsed = false;
        let focusRunner = null;
        let focusEndTime = 0;
        let obstacleZoneActivatedAt = -1; 
        let obstacleZoneClearedTime = -1;
        let leaderX = 0;
        let currentLeader = null;

        const TRACK_LENGTH = 10000;
        const FINISH_LINE = 9800;
        const OBSTACLE_START = 3500;
        const OBSTACLE_END = 5000;
        const MAX_LANES = 8; 
        const strategies = ["도주", "선행", "선입", "추입"];

        async function createRoom() {
            const urlInput = document.getElementById('dcUrl').value;
            const delaySec = parseInt(document.getElementById('delaySelect').value);
            const statusDiv = document.getElementById('lobby-status');
            const btn = document.getElementById('createBtn');

            if (!urlInput.trim()) { statusDiv.innerText = "URL을 입력해주세요."; return; }

            statusDiv.innerText = "참가자 데이터를 수집 중입니다... (약 2~5초 소요)";
            btn.disabled = true;

            const scheduledTime = Math.floor(Date.now() / 1000) + delaySec;

            try {
                const response = await fetch(`${API_BASE}/create_room`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput, scheduled_time: scheduledTime })
                });
                
                const data = await response.json();
                if (data.success) {
                    statusDiv.style.color = 'green';
                    statusDiv.innerText = data.message;
                    setTimeout(() => { window.location.href = `?room=${data.room_id}`; }, 1000);
                } else {
                    statusDiv.innerText = "오류: " + data.message;
                    btn.disabled = false;
                }
            } catch (err) {
                statusDiv.innerText = "서버 통신 실패.";
                btn.disabled = false;
            }
        }

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            if (!roomId) return;

            document.getElementById('lobby-panel').style.display = 'none';
            try {
                const response = await fetch(`${API_BASE}/room/${roomId}`);
                const resData = await response.json();
                if (!resData.success) {
                    alert(resData.message);
                    window.location.href = "?"; 
                    return;
                }
                roomData = resData.data;
                document.getElementById('game-scale-wrapper').style.display = 'flex';
                resizeGame();
                initRunners();
                document.getElementById('countdown-overlay').style.display = 'flex';
                startCountdown();
            } catch (err) {
                alert("방 정보를 불러올 수 없습니다.");
            }
        };

        function startCountdown() {
            let timer = setInterval(() => {
                const now = Math.floor(Date.now() / 1000);
                let diff = roomData.scheduled_time - now;
                if (diff <= 0) {
                    clearInterval(timer);
                    document.getElementById('countdown-overlay').style.display = 'none';
                    startRace();
                } else {
                    let m = Math.floor(diff / 60).toString().padStart(2, '0');
                    let s = (diff % 60).toString().padStart(2, '0');
                    document.getElementById('countdown-text').innerText = `${m}:${s}`;
                }
            }, 1000);
        }

        function showCommentary(text) {
            const board = document.getElementById('commentary-board');
            const existing = board.querySelectorAll('.msg-line');
            existing.forEach(el => el.classList.remove('latest'));
            const newLine = document.createElement('div');
            newLine.className = 'msg-line latest';
            newLine.innerHTML = `<span class="icon">▶</span> ${text}`;
            board.appendChild(newLine);
            if (board.children.length > 5) board.removeChild(board.firstChild);
        }

        function triggerUltimate(runner) {
            isPaused = true;
            const cutin = document.getElementById('ult-cutin');
            document.getElementById('ult-user').innerText = runner.name;
            cutin.style.display = 'flex';
            showCommentary(`💥 기적의 스퍼트! 중위권의 ${runner.name}가 괴력을 발휘합니다!!`);

            setTimeout(() => {
                cutin.style.display = 'none';
                isPaused = false;
                runner.stats.speed += 35; 
                runner.isUltimateActive = true;
                
                // 필살기 사용 시 스프라이트 발광 효과 추가
                runner.spriteEl.style.filter += " drop-shadow(0 0 10px #ffeb3b) brightness(1.2)";
                
                focusRunner = runner;
                focusEndTime = gameTime + 3.0; 
                lastRealTime = Date.now(); 
                requestAnimationFrame(gameLoop); 
            }, 2000); 
        }

        function initRunners() {
            let seedNumber = xmur3(roomData.seed)(); 
            seededRandom = mulberry32(seedNumber);

            const debugTbody = document.getElementById('debug-tbody');
            // 주자 높이(50px)를 고려해 게임창 높이 조정
            const requiredHeight = Math.max(450, roomData.participants.length * 55 + 50);
            document.getElementById('game-window').style.height = requiredHeight + 'px';
            debugTbody.innerHTML = '';
            
            runners = [];
            roomData.participants.forEach((name, index) => {
                let baseStats = [40, 40, 40, 40, 40]; 
                let remain = 110; 
                while(remain > 0) {
                    let rIdx = Math.floor(seededRandom() * 5);
                    if (baseStats[rIdx] < 80) {
                        let add = Math.min(remain, 80 - baseStats[rIdx], Math.floor(seededRandom() * 5) + 1);
                        baseStats[rIdx] += add;
                        remain -= add;
                    }
                }
                
                let conditions = ["최악(x0.9)", "저조(x0.95)", "보통(x1.0)", "양호(x1.05)", "최상(x1.1)"];
                let condIdx = Math.floor(seededRandom() * conditions.length);
                let condMod = 0.9 + (condIdx * 0.05);

                let stats = {
                    speed: baseStats[0] * condMod,
                    stamina: baseStats[1] * condMod,
                    power: baseStats[2] * condMod,
                    guts: baseStats[3] * condMod,
                    intel: baseStats[4] * condMod
                };

                const strategy = strategies[Math.floor(seededRandom() * strategies.length)];
                const laneIndex = index % MAX_LANES; 
                const rowIndex = Math.floor(index / MAX_LANES); 
                let startX = 250 - (rowIndex * 70);

                // 🎨 1. 주자 컨테이너 생성
                const runnerEl = document.createElement('div');
                runnerEl.className = 'runner-container';
                runnerEl.style.top = `${20 + (laneIndex * 55)}px`;

                // 📛 2. 이름 태그
                const nameTag = document.createElement('div');
                nameTag.className = 'runner-name-tag';
                nameTag.innerText = name;
                runnerEl.appendChild(nameTag);

                // 🐶 3. 캐릭터 스프라이트 적용 (팔레트 스왑)
                const sprite = document.createElement('div');
                sprite.className = 'runner-sprite';
                // 랜덤한 각도로 색상을 비틀어줌 (0 ~ 360도)
                const randomHue = Math.floor(seededRandom() * 360);
                // 기본적으로 hue-rotate 필터를 적용해둠
                sprite.style.filter = `hue-rotate(${randomHue}deg)`;
                
                // 각질에 따라 뛰는 애니메이션 속도 조절
                let animSpeed = 0.5;
                if (strategy === "도주") animSpeed = 0.35;
                if (strategy === "추입") animSpeed = 0.6;
                // 애니메이션 적용
                sprite.style.animation = `runWiggle ${animSpeed}s infinite alternate ease-in-out`;
                runnerEl.appendChild(sprite);

                // ⚡ 4. 스태미나 바
                const staminaBarBg = document.createElement('div');
                staminaBarBg.className = 'stamina-bar-bg';
                const staminaFill = document.createElement('div');
                staminaFill.className = 'stamina-bar-fill';
                staminaBarBg.appendChild(staminaFill);
                runnerEl.appendChild(staminaBarBg);
                
                document.getElementById('track').appendChild(runnerEl);

                // 🗺️ 미니맵 점
                const dotEl = document.createElement('div');
                dotEl.className = 'minimap-dot';
                dotEl.innerText = name.substring(0, 1);
                dotEl.style.top = `${10 + (laneIndex / MAX_LANES) * 80}%`;
                document.getElementById('minimap-container').appendChild(dotEl);

                runners.push({
                    name: name, element: runnerEl, spriteEl: sprite, baseHue: randomHue, staminaFillEl: staminaFill, dotElement: dotEl,
                    x: startX, stats: stats, strategy: strategy,
                    speedBoost: 1.0, hasSkill: true,
                    stunnedUntil: 0, immuneUntil: 0, 
                    maxStamina: stats.stamina * 38, currentStamina: stats.stamina * 38, 
                    isNormalSkillActive: false, isUltimateActive: false, finished: false
                });

                debugTbody.innerHTML += `<tr><td><strong>${name}</strong></td>
                    <td style="color:${condIdx>=3?'blue':(condIdx<=1?'red':'black')}">${conditions[condIdx]}</td>
                    <td>${stats.speed.toFixed(1)}</td><td>${stats.stamina.toFixed(1)}</td><td>${stats.power.toFixed(1)}</td>
                    <td>${stats.guts.toFixed(1)}</td><td>${stats.intel.toFixed(1)}</td>
                    <td style="font-weight:bold;">${strategy}</td></tr>`;
            });
            renderFrame(); 
        }

        function startRace() {
            if (isRacing) return;
            isRacing = true;
            isPaused = false;
            lastRealTime = Date.now();
            showCommentary("🏁 출발했습니다! 뽈뽈뽈 귀여운 레이스가 시작됩니다.");
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (isPaused) return;
            let now = Date.now();
            let frameTime = now - lastRealTime;
            lastRealTime = now;
            accumulator += frameTime;

            while (accumulator >= TICK_MS && !raceEnded) {
                updatePhysics(TICK_DT);
                accumulator -= TICK_MS;
                gameTime += TICK_DT;
            }
            renderFrame(); 
            
            if (!raceEnded && !isPaused) requestAnimationFrame(gameLoop);
        }

        function updatePhysics(dt) {
            leaderX = 0;
            currentLeader = null;
            runners.forEach(r => { if (r.x > leaderX) { leaderX = r.x; currentLeader = r; } });

            if (leaderX > OBSTACLE_START && obstacleZoneActivatedAt === -1) {
                obstacleZoneActivatedAt = gameTime;
                showCommentary("🚧 선두 그룹이 덫 지대에 진입했습니다!");
            }
            if (leaderX > OBSTACLE_END && obstacleZoneClearedTime === -1) {
                obstacleZoneClearedTime = gameTime;
                showCommentary("💨 선두 주자가 위험 구간을 무사히 돌파했습니다!");
            }

            if (!ultimateUsed && obstacleZoneClearedTime !== -1 && (gameTime - obstacleZoneClearedTime >= 2.0)) {
                let sortedRunners = [...runners].sort((a, b) => b.x - a.x);
                let eligibleRunners = sortedRunners.slice(1).filter(r => r.x > 100);
                if (eligibleRunners.length > 0) {
                    ultimateUsed = true;
                    let N = eligibleRunners.length;
                    let weights = eligibleRunners.map((r, i) => Math.sin(Math.PI * (i + 1) / (N + 1)));
                    let totalWeight = weights.reduce((a, b) => a + b, 0);
                    let randomVal = seededRandom() * totalWeight;
                    let sum = 0;
                    let luckyRunner = eligibleRunners[0]; 
                    for (let i = 0; i < N; i++) {
                        sum += weights[i];
                        if (randomVal <= sum) { luckyRunner = eligibleRunners[i]; break; }
                    }
                    triggerUltimate(luckyRunner);
                    return; 
                }
            }

            runners.forEach(runner => {
                if (runner.finished) return;
                let trackPercent = runner.x / FINISH_LINE;

                if (runner.x > OBSTACLE_START && runner.x < OBSTACLE_END) {
                    let isInStun = (gameTime < runner.stunnedUntil);
                    let isImmune = (gameTime < runner.immuneUntil);
                    if (!isInStun && !isImmune) {
                        let timeSinceActive = gameTime - obstacleZoneActivatedAt;
                        let baseTrapChance = 0.04 * Math.max(0, 1 - (timeSinceActive / 15.0));
                        if (seededRandom() < baseTrapChance) {
                            let evadeChance = (runner.stats.intel / 100) * 0.5; 
                            if (runner === currentLeader) evadeChance = -0.3; 
                            if (seededRandom() > evadeChance) {
                                let stunDur = (800 - (runner.stats.power * 2)) / 1000.0;
                                if(stunDur < 0.3) stunDur = 0.3;
                                runner.stunnedUntil = gameTime + stunDur;
                                runner.immuneUntil = runner.stunnedUntil + 1.5; 
                                if(runner === currentLeader) showCommentary(`🚨 선두 ${runner.name}, 덫에 넘어졌습니다!!`);
                            }
                        }
                    }
                }
                
                if (gameTime < runner.stunnedUntil) return; 

                let skillDisabled = (leaderX > FINISH_LINE * 0.85) || !(runner.x > FINISH_LINE * 0.20);
                let isGlobalCooldown = (gameTime - lastSkillTime < 5.0);
                let skillProb = 0.005 + (runner.stats.intel / 1000); 

                if (runner.hasSkill && !skillDisabled && !isGlobalCooldown && seededRandom() < skillProb) {
                    runner.hasSkill = false;
                    lastSkillTime = gameTime;
                    runner.speedBoost = 2.0;
                    runner.isNormalSkillActive = true;
                    showCommentary(`💡 [스킬] ${runner.name} 선수가 가속합니다!`);
                }

                let strategyMultiplier = 1.0;
                if (runner.strategy === "도주" && trackPercent < 0.3) strategyMultiplier = 1.20;
                if (runner.strategy === "선행" && trackPercent > 0.15 && trackPercent < 0.5) strategyMultiplier = 1.15;
                if (runner.strategy === "선입" && trackPercent > 0.4 && trackPercent < 0.75) strategyMultiplier = 1.15;
                if (runner.strategy === "추입" && trackPercent > 0.7) strategyMultiplier = 1.25;

                runner.currentStamina -= (runner.stats.speed * 0.025) * strategyMultiplier * dt * 60; 

                let staminaMod = 1.0;
                if (runner.currentStamina <= 0 && trackPercent > 0.4) staminaMod = 0.5; 

                let gutsMod = 1.0;
                if (trackPercent > 0.7) gutsMod = 1.0 + (runner.stats.guts / 150);

                if (runner.speedBoost > 1.0) runner.speedBoost -= 0.015 * (dt * 60); 
                else { runner.speedBoost = 1.0; runner.isNormalSkillActive = false; }

                let catchUpMod = 1.0;
                let distanceToLeader = leaderX - runner.x;
                if (distanceToLeader > 300) {
                    catchUpMod = 1.0 + Math.min(0.25, distanceToLeader / 4000); 
                }

                let moveAmount = (runner.stats.speed * 0.055) * strategyMultiplier * staminaMod * gutsMod * runner.speedBoost * catchUpMod * (seededRandom() * 0.2 + 0.9);
                runner.x += moveAmount * (dt * 60);

                if (runner.x >= FINISH_LINE && !raceEnded) {
                    raceEnded = true;
                    showCommentary(`🏆 결승선 통과! [${runner.name}] 우승!`);
                }
            });
        }

        // 🌟 화면 렌더링 부 (2D 스프라이트 시각화)
        function renderFrame() {
            runners.forEach(runner => {
                runner.element.style.left = runner.x + 'px';
                
                let staminaPercent = Math.max(0, (runner.currentStamina / runner.maxStamina) * 100);
                runner.staminaFillEl.style.width = staminaPercent + '%';
                if (runner.currentStamina <= 0) runner.staminaFillEl.style.backgroundColor = 'red';

                // 상태에 따른 스프라이트 애니메이션 제어
                let isStunned = (gameTime < runner.stunnedUntil);
                let isFinished = runner.x >= FINISH_LINE;
                
                if (isStunned) {
                    // 기절 시 거무튀튀하게 멈춤
                    runner.spriteEl.className = 'runner-sprite stunned-sprite';
                    runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg) grayscale(100%) brightness(50%)`;
                } else if (isFinished) {
                    // 결승선 통과 시 제자리에 서있음 (애니메이션 정지)
                    runner.spriteEl.className = 'runner-sprite';
                    runner.spriteEl.style.animationPlayState = 'paused';
                    runner.spriteEl.style.transform = 'rotate(0deg) translateY(0px)';
                } else {
                    // 정상 달리기
                    runner.spriteEl.className = 'runner-sprite';
                    runner.spriteEl.style.animationPlayState = 'running';
                    // 발광 이펙트는 필살기 지속시간 동안 유지
                    if (runner.isUltimateActive) {
                        runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg) drop-shadow(0 0 10px #ffeb3b) brightness(1.2)`;
                    } else {
                        runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg)`;
                    }
                }
                
                if (gameTime < runner.immuneUntil && gameTime >= runner.stunnedUntil) runner.spriteEl.classList.add('immune-sprite');

                let minimapPercent = Math.max(0, Math.min((runner.x / TRACK_LENGTH) * 100, 100));
                runner.dotElement.style.left = `calc(${minimapPercent}% - 7px)`;
                
                if (runner.isUltimateActive) runner.dotElement.className = 'minimap-dot ult-active';
                else if (runner.isNormalSkillActive) runner.dotElement.className = 'minimap-dot skill-active';
                else runner.dotElement.className = 'minimap-dot';
            });

            // 카메라 위치 설정 (우측 70% 지점에 선두 고정)
            let cameraX = leaderX;
            if (focusRunner && gameTime < focusEndTime) cameraX = focusRunner.x;
            
            let trackLeftOffset = Math.max(0, cameraX - 600);
            if (trackLeftOffset > TRACK_LENGTH - 900) trackLeftOffset = TRACK_LENGTH - 900;
            
            document.getElementById('track').style.left = -trackLeftOffset + 'px';
            document.getElementById('minimap-viewport').style.left = `${(trackLeftOffset / TRACK_LENGTH) * 100}%`;
        }
    </script>
