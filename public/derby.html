<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>왁마갤 무스메 : 시네마틱 디렉터 컷</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #0f1115; padding: 10px 0; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; overflow-x: hidden; }
        h1 { text-align: center; margin-bottom: 5px; color: #fbc531; font-size: 24px; }
        
        #lobby-panel { width: 90%; max-width: 650px; background-color: #2f3640; border-radius: 10px; padding: 20px; box-sizing: border-box; text-align: center; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #lobby-panel input[type="text"], select { width: 80%; padding: 10px; font-size: 15px; margin: 8px 0; border: 2px solid #718093; border-radius: 5px; text-align: center; background: #353b48; color: white; }
        button { padding: 10px 20px; font-size: 15px; font-weight: bold; cursor: pointer; background-color: #00a8ff; color: white; border: none; border-radius: 8px; transition: 0.2s; }
        button:hover { background-color: #0097e6; }
        
        #filter-box { display: none; background: #1e272e; padding: 15px; border-radius: 8px; margin: 15px 0; max-height: 250px; overflow-y: auto; text-align: left; border: 1px solid #718093; }
        .filter-badge { display: inline-block; background: #3498db; color: white; padding: 5px 10px; margin: 4px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .filter-badge.excluded { background: #95a5a6; text-decoration: line-through; opacity: 0.8; }
        .option-group { margin: 15px 0; background: #1e272e; padding: 10px; border-radius: 5px; text-align: left;}
        .option-group label { display: inline-flex; align-items: center; cursor: pointer; font-weight: bold; color: #ffeb3b; }
        .option-group input[type="checkbox"] { width: 20px; height: 20px; margin-right: 10px; accent-color: #e84118; cursor: pointer; }
        
        #game-ui { width: 1000px; display: none; flex-direction: column; gap: 8px; margin-top: 10px; position: relative; }
        #header-area { display: flex; flex-direction: column; gap: 5px; background: #2f3640; padding: 10px; border-radius: 8px; z-index: 10; }
        #timer-box { display: flex; justify-content: space-between; align-items: center; color: #fbc531; font-weight: bold; font-size: 18px; }
        
        #screen-container { width: 100%; height: 500px; background: #87CEEB; overflow: hidden; position: relative; border: 4px solid #485460; border-radius: 12px; box-shadow: inset 0 0 40px rgba(0,0,0,0.4); perspective: 8000px; }
        #world { position: absolute; left: 50%; top: 66.6%; width: 0; height: 0; transform-style: preserve-3d; }
        
        /* 다이나믹 미니맵 */
        #integrated-minimap {
            position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
            width: 80%; display: flex; flex-direction: column; align-items: center;
            z-index: 80; opacity: 0; transition: top 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-in-out;
        }
        #integrated-minimap.show { top: 20px; opacity: 1; }
        
        /* 유성 궤적 게이지 */
        #minimap-progress-track { width: 100%; height: 6px; background: rgba(0,0,0,0.4); border-radius: 3px; position: relative; margin-bottom: 15px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8); overflow: visible; }
        #leader-trail { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: linear-gradient(90deg, transparent, #0be881, #fff); box-shadow: 0 0 15px #0be881, 0 0 5px #fff; border-radius: 3px; transition: width 0.1s linear; }
        
        .minimap-marker { position: absolute; top: -4px; height: 14px; width: 2px; background: rgba(255,255,255,0.5); }
        .minimap-marker span { position: absolute; top: -18px; left: -15px; font-size: 11px; color: #fff; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .minimap-start { left: 0%; }
        .minimap-mid1 { left: 16.6%; }
        .minimap-mid2 { left: 66.6%; }
        .minimap-goal { left: 100%; }
        
        /* 마군 뷰 (오각형 화살표 아이콘) */
        #minimap-pack-view { width: 100%; height: 35px; position: relative; }
        .minimap-runner-icon { 
            position: absolute; 
            width: 14px; height: 14px; 
            clip-path: polygon(0% 0%, 70% 0%, 100% 50%, 70% 100%, 0% 100%);
            filter: drop-shadow(1px 1px 1px black);
            transform: translate(-50%, -50%); 
            transition: left 0.1s linear; 
            z-index: 82;
            display: flex; justify-content: center; align-items: center;
        }
        .minimap-runner-icon span {
            color: #fff; font-size: 9px; font-weight: 900; 
            margin-right: 2px; 
            text-shadow: 1px 1px 1px #000, -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000; 
        }

        /* 왼쪽 스킬 발동 팝업 로그 */
        #skill-log-box { position: absolute; top: 80px; left: 15px; width: 250px; display: flex; flex-direction: column; gap: 5px; z-index: 80; pointer-events: none; }
        .skill-log-item { background: linear-gradient(90deg, rgba(0,0,0,0.8), rgba(0,0,0,0.3)); border-left: 4px solid #FFD700; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; animation: slideInLeft 0.3s ease-out forwards, fadeOut 0.5s ease-in 2.5s forwards; text-shadow: 1px 1px 2px #000; }
        .skill-log-item img { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #FFD700; background-color: #222; }
        @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* 방사형 에네르기 아우라 */
        .energy-aura {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px; border-radius: 50%;
            mix-blend-mode: screen; opacity: 0; pointer-events: none; z-index: 4; transition: opacity 0.3s ease;
        }
        .energy-aura.buff {
            background: radial-gradient(circle, rgba(0,255,255,0.7) 0%, rgba(0,255,255,0) 65%);
            animation: pulseAura 1s infinite alternate; opacity: 1;
        }
        .energy-aura.debuff {
            background: radial-gradient(circle, rgba(138,43,226,0.7) 0%, rgba(138,43,226,0) 65%);
            animation: pulseAura 1s infinite alternate; opacity: 1; mix-blend-mode: multiply;
        }
        .energy-aura.debuff-mix {
            background: radial-gradient(circle, rgba(200,200,255,0.7) 0%, rgba(200,200,255,0) 65%);
            animation: pulseAura 1s infinite alternate; opacity: 1;
        }
        @keyframes pulseAura {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1.0; }
        }

        /* 팝업 아이콘 (가슴 중앙) */
        .status-popup-icon {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: auto; z-index: 20; pointer-events: none;
            animation: popUpFadeBody 1.2s ease-out forwards;
        }
        @keyframes popUpFadeBody {
            0% { transform: translate(-50%, 0%) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -70%) scale(1.0); opacity: 1; }
            100% { transform: translate(-50%, -100%) scale(0.8); opacity: 0; }
        }

        .runner-base { position: absolute; width: 0px; height: 0px; transform-style: preserve-3d; z-index: 5; }
        .sprite-wrapper { position: absolute; bottom: 0; left: -150px; width: 300px; height: 300px; transform-origin: bottom center; will-change: transform; }
        .flip-wrapper { width: 100%; height: 100%; transition: transform 0.2s; position: relative; z-index: 10; } 
        .sprite-anim { width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: bottom center; transform-origin: bottom center; filter: drop-shadow(10px 10px 20px rgba(0,0,0,0.6)); position: relative; z-index: 5; }
        
        @keyframes runCycle { 0% { transform: translateY(0px) rotateZ(0deg); } 25% { transform: translateY(-15px) rotateZ(4deg); } 50% { transform: translateY(0px) rotateZ(0deg); } 75% { transform: translateY(-15px) rotateZ(-4deg); } 100% { transform: translateY(0px) rotateZ(0deg); } }
        .running { animation: runCycle 0.6s infinite linear; }
        .exhausted { transform: translateY(20px) rotateZ(-15deg); filter: grayscale(100%) brightness(0.6) !important; }
        
        @keyframes startleJump { 0% { transform: scale(1) translateY(0); } 50% { transform: scale(1.1) translateY(-60px) rotateZ(10deg); filter: brightness(1.5); } 100% { transform: scale(1) translateY(0); } }
        .startled .sprite-anim { animation: startleJump 0.4s ease-out; }
        .panic-mark { position: absolute; top: -60px; left: 70px; font-size: 80px; font-weight: bold; color: #ff4757; opacity: 0; text-shadow: 4px 4px 6px black; transform-origin: bottom center; }
        .startled .panic-mark { opacity: 1; animation: floatUpChat 0.5s forwards; }
        
        .name-tag { font-size: 55px; font-weight: bold; background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 15px; position: absolute; top: -80px; left: 25px; white-space: nowrap; z-index: 15; }
        .status-badge { display: none !important; } 
        .hp-bar { display: none !important; }
        
        /* 다이나믹 중계창 */
        #commentary-board { background: transparent; color: #fff; padding: 10px 15px; height: 100px; overflow-y: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
        .msg-line { font-size: 18px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 8px; border-left: 5px solid #3498db; width: fit-content; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: fadeInMsg 0.3s forwards; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .msg-line.highlight { color: #f1c40f; font-size: 20px; border-left-color: #e74c3c; }
        @keyframes fadeInMsg { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        
        /* 관중석(채팅창) 실루엣 연출 및 크기 축소 */
        #spectator-area { width: 100%; height: 200px; border-radius: 12px; border: 2px solid #353b48; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 10px; box-sizing: border-box; background: linear-gradient(to bottom, #111, #222); }
        #spectator-area::before {
            content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 120%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><path d="M5,20 Q10,15 15,20 Q20,10 25,20 Q30,12 35,20 Q40,5 45,20 Q50,15 55,20 Q60,10 65,20 Q70,5 75,20 Q80,18 85,20 Q90,8 95,20 Z" fill="rgba(0,0,0,0.8)"/></svg>');
            background-size: cover; background-position: bottom; background-repeat: repeat-x; opacity: 0.8; z-index: 1; pointer-events: none;
        }

        /* 채팅 랜덤 표시 (흰 테두리) */
        .chat-bubble { position: absolute; color: #fff; font-size: 16px; font-weight: 900; white-space: nowrap; z-index: 10; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 5px rgba(0,0,0,0.8); animation: popChat 2.5s ease-in-out forwards; transform: translateX(-50%); pointer-events: none; }
        @keyframes popChat { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.5); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1.2); } 20% { transform: translate(-50%, 0) scale(1.0); } 80% { opacity: 1; transform: translate(-50%, -5px); } 100% { opacity: 0; transform: translate(-50%, -15px); } }
        
        #chat-controls { display: flex; justify-content: center; gap: 15px; align-items: center; z-index: 20; padding: 0 10px; margin-top: auto; }
        .chat-macros { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .chat-macros button { padding: 6px 12px; font-size: 13px; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.5); border-radius: 15px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); }
        .chat-macros button:hover { background: rgba(255,255,255,0.5); }
        #custom-chat-box { display: none; gap: 5px; }
        #custom-chat-box input { padding: 6px 10px; border-radius: 15px; border: none; outline: none; font-weight: bold; width: 200px; background: rgba(255,255,255,0.8); }
        #custom-chat-box button { background: #e84118; color: white; padding: 6px 15px; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }
        
        #ult-cutin { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(50,0,0,0.8); z-index: 20; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #ult-cutin-bg { width: 100%; background: linear-gradient(90deg, transparent, #e53935, transparent); padding: 40px 0; border-top: 2px solid #ffeb3b; border-bottom: 2px solid #ffeb3b; }
        .cutin-name { font-size: 45px; font-weight: 900; color: #ffe082; text-shadow: 3px 3px 5px #000; }
        
        #podium-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .podium-title { position: absolute; top: 40px; font-size: 50px; font-weight: 900; color: #FFD700; text-shadow: 0 0 20px #FF8C00, 3px 3px 5px #000; animation: floatUpTitle 1s ease-out forwards; }
        @keyframes floatUpTitle { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        #podium-container { position: relative; width: 800px; height: 350px; }
        .podium-step { position: absolute; bottom: 0; width: 160px; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; font-size: 50px; font-weight: 900; color: rgba(255,255,255,0.8); text-shadow: 2px 2px 4px #000; border-top-left-radius: 10px; border-top-right-radius: 10px; box-shadow: inset 0 10px 20px rgba(255,255,255,0.2), 0 10px 20px rgba(0,0,0,0.8); }
        .step-1 { left: 50%; transform: translateX(-50%); height: 220px; background: linear-gradient(to bottom, #f1c40f, #e67e22); z-index: 3; }
        .step-2 { left: calc(50% - 160px); transform: translateX(-50%); height: 150px; background: linear-gradient(to bottom, #bdc3c7, #7f8c8d); z-index: 2; }
        .step-3 { left: calc(50% + 160px); transform: translateX(-50%); height: 100px; background: linear-gradient(to bottom, #cd7f32, #a04000); z-index: 1; }
        .podium-runner { position: absolute; transform-origin: bottom center; display: flex; flex-direction: column; align-items: center; }
        .podium-name { background: rgba(0,0,0,0.8); color: white; padding: 4px 12px; border-radius: 8px; font-size: 20px; font-weight: bold; white-space: nowrap; margin-bottom: -20px; z-index: 10; border: 2px solid #555; }

        /* 필살기 만화 집중선 이펙트 */
        #ult-edge-effect { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; background: repeating-conic-gradient( from 0deg at 50% 50%, transparent 0deg, transparent 1deg, rgba(255, 255, 255, 0.8) 1.2deg, rgba(255, 255, 255, 0.8) 1.5deg, transparent 1.7deg ); -webkit-mask-image: radial-gradient(circle at center, transparent 40%, black 100%); mask-image: radial-gradient(circle at center, transparent 40%, black 100%); animation: focusFlicker 0.1s infinite alternate; }
        @keyframes focusFlicker { 0% { transform: scale(1.0); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1.0; } }
    </style>
</head>
<body>

    <h1>🏁 왁마갤 무스메 <span style="font-size: 16px; color:#dcdde1; font-weight:normal;">- 시네마틱 디렉터 컷 -</span></h1>

    <div id="lobby-panel">
        <h2>대회 방 생성</h2>
        <input type="text" id="dcUrl" placeholder="디시인사이드 게시글 주소를 입력하세요">
        <button onclick="extractParticipants()">참가자 추출</button>
        <div id="lobby-status" style="margin-top: 10px; color: #fbc531; font-weight: bold;"></div>
        <div id="filter-box"></div>
        <div id="setup-box" style="display:none; margin-top:20px;">
            <div class="option-group" style="border-bottom: 2px dashed #718093; padding-bottom: 15px;">
                <label><input type="checkbox" id="timeCutoffToggle" onchange="toggleTimeCutoff()"> ⏱️ 댓글 시간컷 필터링 (선택)</label>
                <div id="timeCutoffContainer" style="display: none; margin-top: 8px;">
                    <input type="text" id="timeCutoffInput" placeholder="클릭하여 기준 시간 선택/입력" style="width: 70%; padding: 10px; background: #2f3640;">
                    <button onclick="applyTimeFilter()" style="margin-top: 10px; font-size: 14px; background: #e53935;">시간 필터 적용</button>
                </div>
            </div>
            <div style="margin: 10px 0; padding: 10px; background: #1e272e; border-radius: 5px; color: #0be881; font-weight: bold;">🗼 맵: 도쿄 경기장 (2,000m) 도심 레이싱</div>
            <select id="bgmSelect">
                <option value="none">🔇 BGM 없음</option>
                <option value="random">🔀 랜덤 BGM</option>
                <option value="SKY HiGH Remix.mp3">SKY HiGH Remix</option>
                <option value="CIDER BANG! Remix.mp3">CIDER BANG! Remix</option>
                <option value="우주미아 Remix.mp3">우주미아 Remix</option>
                <option value="Ballin Remix.mp3">Ballin Remix</option>
                <option value="HEADLINE.mp3">HEADLINE</option>
                <option value="We Ride.mp3">We Ride</option>
                <option value="WAKTA!.mp3">WAKTA!</option>
                <option value="스키!.mp3">스키!</option>
                <option value="FINISH LINE.mp3">FINISH LINE (아세토 고갯길배틀)</option>
                <option value="Boosting Higher.mp3">Boosting Higher (아세토 고갯길배틀)</option>
                <option value="데자부.mp3">데자부</option>
                <option value="왁스라다 리믹스.mp3">왁스라다</option>
                <option value="지구용사 우왁굳.mp3">지구용사 우왁굳</option>
                <option value="융터르.mp3">융터르</option>
                <option value="꾀꼬리.mp3">꾀꼬리 (파이널 로맨스)</option>
                <option value="멋쟁이 신사 쿤미옌.mp3">멋쟁이 신사 쿤미옌 (파이널 로맨스)</option>
                <option value="아니아니아닌데.mp3">아니아니아닌데 (파이널 로맨스)</option>
                <option value="종천지모 Megamix.mp3">종천지모 Megamix</option>
            </select>
            <div class="option-group">
                <label><input type="checkbox" id="allowCustomChat">💬 관객석 커스텀(자유) 채팅 허용</label>
            </div>
            <input type="text" id="datetimeInput" placeholder="시작 시간 예약 (클릭)">
            <br><button onclick="createRoomFinal()" style="background:#e84118; margin-top: 10px;">방 개설 및 서버 연산 시작</button>
        </div>
    </div>

    <div id="game-ui">
        <div id="header-area">
            <div id="timer-box">
                <span id="camera-status" style="color: #0be881; font-size: 14px;">🎥 대기 중</span>
                <div style="font-size: 22px;">⏳ <span id="main-timer">대기 중</span></div>
            </div>
        </div>
        <div id="screen-container">
            <div id="world"></div>
            
            <div id="integrated-minimap">
                <div id="minimap-progress-track">
                    <div id="leader-trail"></div>
                    <div class="minimap-marker minimap-start"><span>START</span></div>
                    <div class="minimap-marker minimap-mid1"><span>중반</span></div>
                    <div class="minimap-marker minimap-mid2"><span>종반</span></div>
                    <div class="minimap-marker minimap-goal"><span>GOAL</span></div>
                </div>
                <div id="minimap-pack-view"></div>
            </div>

            <div id="skill-log-box"></div>

            <div id="ult-edge-effect"></div>
            <div id="ult-cutin">
                <div id="ult-cutin-bg"><div style="font-size: 30px; font-weight: bold; color: white;">🔥 [라스트 스퍼트!] 🔥</div><div id="ult-user" class="cutin-name">닉네임</div></div>
            </div>
        </div>
        <div id="commentary-board"></div>
        <div id="spectator-area">
            <div id="chat-controls">
                <div class="chat-macros">
                    <button onclick="sendChat('ㅎㅇ')">ㅎㅇ</button>
                    <button onclick="sendChat('샤욘아!')">샤욘아!</button>
                    <button onclick="sendChat('가즈아아아')">가즈아아아</button>
                    <button onclick="sendChat('떨린다')">떨린다</button>
                    <button onclick="sendChat('주작')">주작</button>
                </div>
                <div id="custom-chat-box">
                    <input type="text" id="customChatInput" placeholder="자유 채팅 입력..." maxlength="20">
                    <button onclick="sendCustomChat()">전송</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

        function processPopupQueue(runnerIdStr) {
            let cache = domCache.get(runnerIdStr);
            if (!cache || cache.isPopupPlaying || cache.popupQueue.length === 0) return;

            cache.popupQueue.sort((a, b) => a.seq - b.seq);
            let nextPopup = cache.popupQueue.shift();
            
            if (!nextPopup || !nextPopup.type) {
                processPopupQueue(runnerIdStr);
                return;
            }
            
            cache.isPopupPlaying = true;
            let icon = document.createElement('img');
            icon.className = 'status-popup-icon';
            icon.src = `assets/skills/${POPUP_MAP[nextPopup.type] || 'SPD_UP.png'}`;

        function getTrackCoordinates(d) {
            let x = 0, y = 0, angle = -Math.PI/2; 
            let R2 = 200 / (Math.PI / 2); let R3 = 275 / (Math.PI / 2); let R4 = 250 / (Math.PI / 2); 
            if (d <= 200) return { x: x, y: y - d, angle: angle };
            y -= 200;
            if (d <= 400) { let t = d - 200; let cAngle = 0 - t / R2; return { x: (x - R2) + R2 * Math.cos(cAngle), y: y + R2 * Math.sin(cAngle), angle: cAngle - Math.PI/2 }; }
            x -= R2; y -= R2;
            if (d <= 950) { let t = d - 400; return { x: x - t, y: y, angle: -Math.PI }; }
            x -= 550;
            if (d <= 1225) { let t = d - 950; let cAngle = -Math.PI/2 - t / R3; return { x: x + R3 * Math.cos(cAngle), y: (y + R3) + R3 * Math.sin(cAngle), angle: cAngle - Math.PI/2 }; }
            x -= R3; y += R3;
            if (d <= 1475) { let t = d - 1225; let cAngle = -Math.PI - t / R4; return { x: (x + R4) + R4 * Math.cos(cAngle), y: y + R4 * Math.sin(cAngle), angle: cAngle - Math.PI/2 }; }
            x += R4; y += R4;
            let t = d - 1475; return { x: x + t, y: y, angle: 0 };
        }

        async function extractParticipants() {
            const urlInput = document.getElementById('dcUrl').value; const statusDiv = document.getElementById('lobby-status');
            if(!urlInput) return; statusDiv.innerText = "명단 추출 중...";
            try {
                const res = await fetch(`${API_BASE}/extract_only`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: urlInput }) });
                const data = await res.json();
                if(data.success) {
                    rawParticipants = data.participants; excludedNames = []; applyTimeFilter();
                    let d = new Date(); d.setMinutes(d.getMinutes() + 2); fpDatetime.setDate(d);
                    statusDiv.innerText = "추출 완료! 명단 필터링 및 설정을 진행하세요.";
                    document.getElementById('filter-box').style.display = 'block'; document.getElementById('setup-box').style.display = 'block';
                } else statusDiv.innerText = "추출 실패: " + data.message;
            } catch(e) { statusDiv.innerText = "서버 통신 오류"; alert("오류: " + e.message); }
        }

        function toggleTimeCutoff() {
            const container = document.getElementById('timeCutoffContainer');
            if (document.getElementById('timeCutoffToggle').checked) { container.style.display = 'block'; fpTimeCutoff.setDate(new Date()); } 
            else { container.style.display = 'none'; fpTimeCutoff.clear(); applyTimeFilter(); }
        }

        function applyTimeFilter() {
            const useTimeCutoff = document.getElementById('timeCutoffToggle').checked;
            let timeFiltered = [];
            if (useTimeCutoff && fpTimeCutoff.selectedDates.length > 0) {
                const cutoffTime = fpTimeCutoff.selectedDates[0].getTime();
                timeFiltered = rawParticipants.filter(p => {
                    if (!p.reg_date) return true; 
                    let dateStr = p.reg_date.replace(/\./g, '-');
                    if (dateStr.split('-').length === 2) { dateStr = new Date().getFullYear() + '-' + dateStr; }
                    let cmtTime = new Date(dateStr).getTime();
                    return !isNaN(cmtTime) && cmtTime <= cutoffTime;
                });
            } else { timeFiltered = rawParticipants; }
            let allValidNames = timeFiltered.map(p => p.name);
            currentExtractedList = allValidNames.filter(name => !excludedNames.includes(name));
            renderFilterBadges(allValidNames); 
        }

        function renderFilterBadges(allValidNames) {
            const box = document.getElementById('filter-box');
            let includedHTML = `<p style="margin:0 0 5px 0; font-size:13px; color:#bdc3c7;">💡 <b>[참가 명단]</b> 클릭 시 제외 (${currentExtractedList.length}명)</p><div>`;
            let excludedHTML = `<p style="margin:15px 0 5px 0; font-size:13px; color:#e53935;">🗑️ <b>[제외된 명단]</b> 클릭 시 복구</p><div>`;
            let excludedCount = 0;
            allValidNames.forEach(name => {
                if (excludedNames.includes(name)) { excludedHTML += `<span class="filter-badge excluded" onclick="toggleExclude('${name}')">${name}</span>`; excludedCount++; } 
                else includedHTML += `<span class="filter-badge" onclick="toggleExclude('${name}')">${name}</span>`; 
            });
            box.innerHTML = includedHTML + "</div>" + (excludedCount > 0 ? excludedHTML + "</div>" : "");
        }

        function toggleExclude(name) {
            if (excludedNames.includes(name)) excludedNames = excludedNames.filter(n => n !== name); else excludedNames.push(name); 
            applyTimeFilter();

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            if (!roomId) return; 

            document.getElementById('lobby-panel').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex'; 

            try {
                const res = await fetch(`${API_BASE}/room/${roomId}`);
                const data = await res.json();
                if(!data.success) { alert("방이 없습니다."); return; }
                roomData = data.data; maxFrames = roomData.replay_data.length;
                if(roomData.allow_custom_chat) document.getElementById('custom-chat-box').style.display = 'flex';
                
                chatRef = database.ref('rooms/' + roomId + '/chats');
                let isFirstLoad = true;
                chatRef.limitToLast(1).on('child_added', (snap) => { if (isFirstLoad) { isFirstLoad = false; return; } spawnChatBubble(snap.val().message); });

                drawTrackCanvas(); initPreShowDOM(); 
                
                const nowSec = Date.now() / 1000;

                if (timeDiff < 0) { 
                    isPreShow = true; 
                    AUDIO_FX.lobby.play().catch(e=>{});
                    requestAnimationFrame(preShowLoop); 
                    startCountdown(); 
                } else { 
                    currentPlaybackTime = timeDiff;
                    if (currentPlaybackTime > (maxFrames * DT)) currentPlaybackTime = maxFrames * DT;
                    startGame(true); 
                }
            } catch(e) { 
                alert(`데이터 로딩 실패!\n에러 내용: ${e.message}`);
            }
        };

        function drawTrackCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 3500; canvas.height = 1750;
            canvas.style.position = 'absolute'; canvas.style.left = '0px'; canvas.style.top = '0px';
            canvas.style.transformOrigin = 'top left'; canvas.style.transform = 'translateZ(-1px) scale(8)'; 
            
            const ctx = canvas.getContext('2d', { alpha: false }); 
            if (!ctx) return;
            ctx.scale(0.125, 0.125); 
            
            ctx.fillStyle = '#C8C8C8'; ctx.fillRect(0, 0, 28000, 14000);
            ctx.strokeStyle = '#BDBDBD'; ctx.lineWidth = 4; ctx.beginPath();
            for(let i = 0; i < 28000; i += 200) { ctx.moveTo(i, 0); ctx.lineTo(i, 14000); }
            for(let i = 0; i < 14000; i += 200) { ctx.moveTo(0, i); ctx.lineTo(28000, i); }
            ctx.stroke();

            let trackPathCoords = [];
            for(let i=0; i<=2050; i+=10) {
                let p = getTrackCoordinates(i);
                let cx = p.x * VISUAL_SCALE + CX + Math.cos(p.angle + Math.PI/2) * (LANE_SCALE * 0.75);
                let cy = p.y * VISUAL_SCALE + CY + Math.sin(p.angle + Math.PI/2) * (LANE_SCALE * 0.75);
                trackPathCoords.push({cx, cy});
            }
            
            ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
            ctx.lineWidth = LANE_SCALE * 1.8; ctx.strokeStyle = '#f1c40f'; ctx.beginPath();
            trackPathCoords.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.cx, pt.cy) : ctx.lineTo(pt.cx, pt.cy));
            ctx.stroke();

            ctx.lineWidth = LANE_SCALE * 1.7; ctx.strokeStyle = '#30343A'; ctx.beginPath();
            trackPathCoords.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.cx, pt.cy) : ctx.lineTo(pt.cx, pt.cy));
            ctx.stroke();
            
            ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.setLineDash([60, 60]); ctx.beginPath();
            trackPathCoords.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.cx, pt.cy) : ctx.lineTo(pt.cx, pt.cy));
            ctx.stroke(); ctx.setLineDash([]);

            let finishP = getTrackCoordinates(2000);
            let fInX = (finishP.x*VISUAL_SCALE + CX) + Math.cos(finishP.angle + Math.PI/2) * (-0.25 * LANE_SCALE);
            let fInY = (finishP.y*VISUAL_SCALE + CY) + Math.sin(finishP.angle + Math.PI/2) * (-0.25 * LANE_SCALE);
            let fOutX = (finishP.x*VISUAL_SCALE + CX) + Math.cos(finishP.angle + Math.PI/2) * (1.75 * LANE_SCALE);
            let fOutY = (finishP.y*VISUAL_SCALE + CY) + Math.sin(finishP.angle + Math.PI/2) * (1.75 * LANE_SCALE);
            
            ctx.beginPath(); ctx.moveTo(fInX, fInY); ctx.lineTo(fOutX, fOutY); 
            ctx.lineWidth = 40; ctx.strokeStyle = '#e74c3c'; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(fInX, fInY); ctx.lineTo(fOutX, fOutY); 
            ctx.lineWidth = 40; ctx.strokeStyle = 'white'; ctx.setLineDash([40, 40]);
            ctx.stroke(); ctx.setLineDash([]);

            let startP = getTrackCoordinates(0);
            let sInX = (startP.x*VISUAL_SCALE + CX) + Math.cos(startP.angle + Math.PI/2) * (-0.25 * LANE_SCALE);
            let sInY = (startP.y*VISUAL_SCALE + CY) + Math.sin(startP.angle + Math.PI/2) * (-0.25 * LANE_SCALE);
            let sOutX = (startP.x*VISUAL_SCALE + CX) + Math.cos(startP.angle + Math.PI/2) * (1.75 * LANE_SCALE);
            let sOutY = (startP.y*VISUAL_SCALE + CY) + Math.sin(startP.angle + Math.PI/2) * (1.75 * LANE_SCALE);
            
            ctx.beginPath(); ctx.moveTo(sInX, sInY); ctx.lineTo(sOutX, sOutY); 
            ctx.lineWidth = 20; ctx.strokeStyle = 'white'; ctx.stroke();
            
            document.getElementById('world').appendChild(canvas);
        }

        function initPreShowDOM() {
            let startPos = getTrackCoordinates(0);
            const chatZones = [
                {x: startPos.x*VISUAL_SCALE+CX + 100, y: startPos.y*VISUAL_SCALE+CY + 600},
                {x: startPos.x*VISUAL_SCALE+CX - 150, y: startPos.y*VISUAL_SCALE+CY + 800},
                {x: startPos.x*VISUAL_SCALE+CX + 300, y: startPos.y*VISUAL_SCALE+CY + 1000}
            ]; 
            
            let minimapContainer = document.getElementById('minimap-pack-view');

            const COLORS = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#fab1a0', '#fd79a8', '#a29bfe', '#00cec9', '#fdcb6e', '#e17055'];

            roomData.participants.forEach((p, idx) => {
                let row = Math.floor(idx / 18);
                let col = idx % 18;
                let startLane = col * 0.08; 
                
                let finalWorldX = startPos.x*VISUAL_SCALE + CX + Math.cos(startPos.angle + Math.PI/2) * (startLane * LANE_SCALE);
                let finalWorldY = startPos.y*VISUAL_SCALE + CY + Math.sin(startPos.angle + Math.PI/2) * (startLane * LANE_SCALE);
                
                let backwardX = Math.cos(startPos.angle) * (-row * 2.5 * VISUAL_SCALE);
                let backwardY = Math.sin(startPos.angle) * (-row * 2.5 * VISUAL_SCALE);
                finalWorldX += backwardX;
                finalWorldY += backwardY;
                
                let gatherY = finalWorldY + 400 + Math.random() * 500;
                
                let behavior = 'ready'; let r = Math.random();
                if (r < 0.3) behavior = 'wander'; else if (r < 0.6) behavior = 'chat'; 
                
                let spawnDist = 1500 + Math.random() * 1000;
                let spawnX = finalWorldX - spawnDist; let spawnY = gatherY + spawnDist;
                
                preShowRunners.push({
                    id: String(p.id), finalX: finalWorldX, finalY: finalWorldY, gatherY: gatherY,
                    currX: spawnX, currY: spawnY, targetX: finalWorldX, targetY: gatherY,
                    behavior: behavior, chatZone: chatZones[Math.floor(Math.random() * chatZones.length)], timer: 0, panicked: false,
                    chatPosSet: false
                });

                let pSkin = p.skin ? (p.skin.startsWith('http') ? p.skin : `assets/skin/${p.skin}`) : 'assets/skin/skin01.png';
                let pHue = p.hue || 0;
                
                const rBase = document.createElement('div'); rBase.className = 'runner-base'; rBase.id = `runner-${p.id}`;
                rBase.style.transform = `translate3d(${spawnX}px, ${spawnY}px, 0)`;

                rBase.innerHTML = `
                    <div class="sprite-wrapper" style="transform: scale(0.35);">
                        <div class="panic-mark">!</div>
                        <div class="energy-aura" id="aura-${p.id}"></div>
                        <div class="flip-wrapper"><div class="sprite-anim" style="background-image: url('${pSkin}'); filter: hue-rotate(${pHue}deg);"></div></div>
                        <div class="name-tag">${p.name}</div>
                    </div>
                `;
                document.getElementById('world').appendChild(rBase);

                const dot = document.createElement('div'); 
                dot.className = 'minimap-runner-icon'; 
                dot.id = `dot-${p.id}`;
                dot.style.background = COLORS[idx % COLORS.length];
                let firstChar = p.name ? p.name.charAt(0) : '?';
                dot.innerHTML = `<span>${firstChar}</span>`;
                
                let vOffset = 5 + (idx % 5) * 5; 
                dot.style.top = `${vOffset}px`;

                domCache.set(String(p.id), {
                    base: rBase,
                    dot: dot,

        }

        function sendChat(msg) { if(chatRef) chatRef.push({ message: msg, timestamp: firebase.database.ServerValue.TIMESTAMP }); }
        function sendCustomChat() { const input = document.getElementById('customChatInput'); if(input.value.trim() !== "") { sendChat(input.value); input.value = ""; } }
        document.getElementById('customChatInput')?.addEventListener('keypress', function (e) { if (e.key === 'Enter') sendCustomChat(); });
        
        function spawnChatBubble(msg) {
            const bubble = document.createElement('div'); bubble.className = 'chat-bubble'; bubble.innerText = msg;
            let randomX = 10 + Math.random() * 80;
            let randomY = 10 + Math.random() * 50;
            bubble.style.left = `${randomX}%`; 
            bubble.style.bottom = `${randomY}%`;
            document.getElementById('spectator-area').appendChild(bubble);
            setTimeout(() => { if(bubble.parentNode) bubble.remove(); }, 2500);
        }

        function applyCamera(camId, isCut, timeTarget, runnerPositions, baseCamStart) {
            if (camId === "ULT") {
                let conf = CAM_SETTINGS["ULT"];
                let focusX = smoothCenterX; let focusY = smoothCenterY;
                
                if (runnerPositions) {
                    let uData = runnerPositions.find(r => r.id === ultUserId);
                    if (uData) { focusX = uData.worldX; focusY = uData.worldY; }
                }

                targetCam.rotX = conf.rotX; targetCam.zoom = conf.zoom; targetCam.rotZ = conf.rotZ;
                targetCam.x = -focusX + conf.offsetX; targetCam.y = -focusY + conf.offsetY;

                if (isCut) {
                    currentCam.x = targetCam.x; currentCam.y = targetCam.y;
                    currentCam.rotX = targetCam.rotX; currentCam.rotZ = targetCam.rotZ; currentCam.zoom = targetCam.zoom;
                } else {
                    currentCam.x += (targetCam.x - currentCam.x) * 0.3; currentCam.y += (targetCam.y - currentCam.y) * 0.3;
                    currentCam.rotX += (targetCam.rotX - currentCam.rotX) * 0.3; currentCam.rotZ += (targetCam.rotZ - currentCam.rotZ) * 0.3;
                    currentCam.zoom += (targetCam.zoom - currentCam.zoom) * 0.3;
                }
                
                document.getElementById('world').style.transform = `scale(${currentCam.zoom}) rotateX(${currentCam.rotX}deg) rotateZ(${currentCam.rotZ}deg) translateX(${currentCam.x}px) translateY(${currentCam.y}px)`;
                return;
            }

            let startPos = getTrackCoordinates(0);
            let elapsed = timeTarget - (baseCamStart !== undefined ? baseCamStart : camStartTime); 
            let t = 0; let e = 0;
            let conf = CAM_SETTINGS[camId];

            if (camId === "1") {
                let nowSec = Date.now() / 1000;
                let timeLeft = roomData.scheduled_time - nowSec;
                
                let calcOffsetY = conf.offsetY;
                if (timeLeft <= 10 && timeLeft > 0) {
                    t = Math.min(1.0, Math.max(0, (10 - timeLeft) / 0.5));
                    e = easeOut(t);
                    targetCam.zoom = conf.zoom + (0.8 - conf.zoom) * e;
                    calcOffsetY = conf.offsetY + (0 - conf.offsetY) * e;
                } else {
                    targetCam.zoom = conf.zoom;
                }
                targetCam.rotX = conf.rotX; targetCam.rotZ = conf.rotZ;
                targetCam.x = -(startPos.x*VISUAL_SCALE + CX) + conf.offsetX;
                targetCam.y = -(startPos.y*VISUAL_SCALE + CY) + calcOffsetY;
            } 
            else if (camId === "1.5") {
                targetCam.rotX = conf.rotX; targetCam.rotZ = conf.rotZ; targetCam.zoom = conf.zoom;
                if (preShowFocusId) {
                    let focusR = preShowRunners.find(r => r.id === preShowFocusId);
                    if (focusR) { targetCam.x = -focusR.currX + conf.offsetX; targetCam.y = -focusR.currY + conf.offsetY; }
                }
            } 
            else if (camId === "4") {
                // 줌아웃 로직 (renderFrame 내부)
            } 
            else {
                let duration = conf.duration || 10;
                t = Math.min(1.0, elapsed / duration); e = easeIn(t);
                
                targetCam.rotX = conf.rotX + ((conf.targetRotX !== undefined ? conf.targetRotX : conf.rotX) - conf.rotX) * e;
                targetCam.rotZ = conf.rotZ + ((conf.targetRotZ !== undefined ? conf.targetRotZ : conf.rotZ) - conf.rotZ) * e;
                targetCam.zoom = conf.zoom + ((conf.targetZoom !== undefined ? conf.targetZoom : conf.zoom) - conf.zoom) * e;
                
                let oX = conf.offsetX + ((conf.targetOffsetX !== undefined ? conf.targetOffsetX : conf.offsetX) - conf.offsetX) * e;
                let oY = conf.offsetY + ((conf.targetOffsetY !== undefined ? conf.targetOffsetY : conf.offsetY) - conf.offsetY) * e;

                if (camId === "8") {
                    let goalP = getTrackCoordinates(2000);
                    let finishWorldX = goalP.x * VISUAL_SCALE + CX;
                    let finishWorldY = goalP.y * VISUAL_SCALE + CY;
                    targetCam.x = -finishWorldX + oX; targetCam.y = -finishWorldY + oY;
                } else {
                    targetCam.x = -smoothCenterX + oX; targetCam.y = -smoothCenterY + oY;
                }
            }

            if (isCut) {
                currentCam.x = targetCam.x; currentCam.y = targetCam.y;
                currentCam.rotX = targetCam.rotX; currentCam.rotZ = targetCam.rotZ; currentCam.zoom = targetCam.zoom;
            } else {
                currentCam.x += (targetCam.x - currentCam.x) * 0.1; currentCam.y += (targetCam.y - currentCam.y) * 0.1;
                currentCam.rotX += (targetCam.rotX - currentCam.rotX) * 0.1; currentCam.rotZ += (targetCam.rotZ - currentCam.rotZ) * 0.1;
                currentCam.zoom += (targetCam.zoom - currentCam.zoom) * 0.1;
            }
            
            document.getElementById('world').style.transform = `scale(${currentCam.zoom}) rotateX(${currentCam.rotX}deg) rotateZ(${currentCam.rotZ}deg) translateX(${currentCam.x}px) translateY(${currentCam.y}px)`;
        }

        function preShowLoop(timestamp) {
            if (!lastPreShowTimestamp) lastPreShowTimestamp = timestamp;
            let delta = (timestamp - lastPreShowTimestamp) / 1000;
            lastPreShowTimestamp = timestamp;
            if (delta > 0.1) delta = 0.1; 

            if (isPreShow) {
                const nowSec = Date.now() / 1000;
                let timeLeft = roomData.scheduled_time - nowSec;

                preShowRunners.forEach(r => {
                    let cache = domCache.get(r.id);
                    if (!cache) return;
                    let speed = 100; 
                    
                    if (timeLeft <= 10 && !r.panicked) { r.panicked = true; r.targetX = r.finalX; r.targetY = r.finalY; cache.base.classList.add('startled'); }
                    if (r.panicked) speed = 350; 

                    if (!r.panicked && timeLeft > 10) {
                        if (r.behavior === 'wander') {
                            r.timer -= delta;
                            if (r.timer <= 0) { r.targetX = r.finalX - 300 + Math.random() * 600; r.targetY = r.gatherY - 200 + Math.random() * 400; r.timer = 2 + Math.random() * 4; }
                        } else if (r.behavior === 'chat') {
                            if (!r.chatPosSet) {
                                r.targetX = r.chatZone.x + (Math.random() * 150 - 75); 
                                r.targetY = r.chatZone.y + (Math.random() * 150 - 75);
                                r.chatPosSet = true;
                            }
                            if (Math.random() < 0.01) { 
                                cache.wrapper.style.transform = 'translateY(-30px) scale(0.35)'; 
                                setTimeout(() => { cache.wrapper.style.transform = 'scale(0.35)'; }, 200); 
                            }
                        }
                    }

                    let dx = r.targetX - r.currX; let dy = r.targetY - r.currY; let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 5) {
                        r.currX += (dx / dist) * speed * delta; r.currY += (dy / dist) * speed * delta;
                        if (r.panicked) cache.sprite.classList.add('running'); else cache.sprite.classList.remove('running');
                        cache.flipWrap.style.transform = (dx > 0) ? 'scaleX(-1)' : 'scaleX(1)';
                    } else {
                        cache.sprite.classList.remove('running'); r.currX = r.targetX; r.currY = r.targetY;
                        if(r.panicked) cache.base.classList.remove('startled'); 
                        if(r.behavior === 'chat') cache.flipWrap.style.transform = (r.currX < r.chatZone.x) ? 'scaleX(-1)' : 'scaleX(1)';
                        if(timeLeft <= 10) cache.flipWrap.style.transform = 'scaleX(1)'; 
                    }
                    
                    cache.base.style.transform = `translate3d(${r.currX}px, ${r.currY}px, 0)`;
                    cache.wrapper.style.transform = `rotateZ(${-currentCam.rotZ}deg) rotateX(${-currentCam.rotX}deg) scale(0.35)`;
                });

                let newCamId = "1";
                if (timeLeft <= 30 && timeLeft > 11) {
                    newCamId = "1.5";
                    if (Date.now() - lastPreShowZoomTime > 4000) {
                        preShowFocusId = preShowRunners[Math.floor(Math.random() * preShowRunners.length)].id;
                        lastPreShowZoomTime = Date.now();
                        activeCamId = null; 
                    }
                    if(preShowFocusId) document.getElementById('camera-status').innerText = `🎥 [카메라 1.5] 선수 줌인 인터뷰 뷰`;
                } else {
                    document.getElementById('camera-status').innerText = "🎥 [카메라 1] 프리쇼 앵글";
                }

                let isCut = false;
                if (activeCamId !== newCamId) { isCut = true; activeCamId = newCamId; camStartTime = Date.now() / 1000; }
                
                applyCamera(activeCamId, isCut, Date.now() / 1000);
                requestAnimationFrame(preShowLoop);
            }
        }

        // 💡 [버그 픽스] 중계 로그 변수 및 완료 플래그 강제 초기화! (레이스 멈춤 100% 방지)
        // 💡 [버그 픽스] lastRenderTimestamp 초기화 (performance.now() 와의 불일치 해소)
        function startGame(isLateJoin = false) {
            window.commentaryLog = new Set();
            window.hasAnnouncedFinish = false;
            
            isPreShow = false; 
            lastRenderTimestamp = 0; 
            activeCamId = "2"; camStartTime = 0;
            
            document.getElementById('camera-status').innerText = "🎥 [카메라 2] 출발 직선 뷰";
            AUDIO_FX.lobby.pause();
            document.getElementById('integrated-minimap').classList.add('show');
            
            preShowRunners.forEach(r => {
                let cache = domCache.get(r.id);
                if(cache) {
                    cache.base.classList.remove('startled'); 
                    cache.base.style.transform = `translate3d(${r.finalX}px, ${r.finalY}px, 0)`; 
                    cache.flipWrap.style.transform = 'scaleX(-1)'; 
                }
            });

            if (roomData.bgm && roomData.bgm !== 'none') {
                globalBgmAudio = new Audio(`assets/bgm/${roomData.bgm}`); globalBgmAudio.loop = true; globalBgmAudio.volume = 0.4;
                globalBgmAudio.play().catch(e => {
                    document.body.addEventListener('click', () => { globalBgmAudio.play(); }, { once: true });
                });
            }
            if(!isLateJoin) {
                AUDIO_FX.whistle.play().catch(e=>{});
                postCommentary("게이트가 열렸습니다! 레이스 스타트!", true);
            }
            AUDIO_FX.run.play().catch(e=>{});
            isPlaying = true; requestAnimationFrame(renderLoop);
        }

        function startCountdown() {
            let timer = setInterval(() => {
                const nowSec = Date.now() / 1000;
                let diff = Math.floor(roomData.scheduled_time - nowSec);
                if (diff <= 0) { clearInterval(timer); startGame(false); } 
                else {
                    let m = Math.floor(diff / 60).toString().padStart(2, '0'); let s = (diff % 60).toString().padStart(2, '0');
                    document.getElementById('main-timer').innerText = `T - ${m}:${s}`;
                    if (diff === 60) postCommentary("주자들이 경기장으로 속속 입장하고 있습니다.");
                    if (diff === 30) postCommentary("선수들의 긴장된 표정이 카메라에 잡힙니다.");
                    if (diff === 10) postCommentary("경기 시작 10초 전! 주자들이 스타트 라인으로 이동합니다!", true);
                }
            }, 1000);
        }

        function renderFrameAtTime(timeTarget) {
            try {
                let exactFrame = timeTarget / DT;
                let frameIdx = Math.floor(exactFrame);
                let nextFrameIdx = Math.min(frameIdx + 1, maxFrames - 1);
                let ratio = exactFrame - frameIdx; 

                let frameData = roomData.replay_data[frameIdx];
                let nextFrameData = roomData.replay_data[nextFrameIdx];
                if (!frameData || !nextFrameData) return;

                if (timeTarget < lastRenderedTimeTarget) triggeredSkillsLog.clear();
                lastRenderedTimeTarget = timeTarget;

                document.getElementById('main-timer').innerText = `RACE - ${timeTarget.toFixed(1)}s`;

                let leaderDist = -1; 
                let nextRDataMap = new Map();
                nextFrameData.r.forEach(r => nextRDataMap.set(r[0], r));

                let runnerPositions = [];

                frameData.r.forEach(rData => {
                    let [idInt, dist, lane, speed, hp, states] = rData; 
                    let id = String(idInt); 
                    let nextR = nextRDataMap.get(idInt);

                    if (nextR) {
                        dist = dist + (nextR[1] - dist) * ratio;
                        lane = lane + (nextR[2] - lane) * ratio;
                    }

                    let pos = getTrackCoordinates(dist); let laneOffset = lane * LANE_SCALE; 
                    let worldX = pos.x * VISUAL_SCALE + CX + Math.cos(pos.angle + Math.PI/2) * laneOffset;
                    let worldY = pos.y * VISUAL_SCALE + CY + Math.sin(pos.angle + Math.PI/2) * laneOffset;

                    runnerPositions.push({ id: id, dist: dist, lane: lane, worldX: worldX, worldY: worldY });

                    if (dist > leaderDist) { leaderDist = dist; }

                    let cache = domCache.get(id);
                    if (cache) {
                        cache.base.style.transform = `translate3d(${worldX}px, ${worldY}px, 0)`; 
                        
                        if (activeCamId === "5" || activeCamId === "ULT") cache.flipWrap.style.transform = 'scaleX(1)';
                        else cache.flipWrap.style.transform = 'scaleX(-1)';

                        cache.wrapper.style.transform = `rotateZ(${-currentCam.rotZ}deg) rotateX(${-currentCam.rotX}deg) scale(0.35)`;
                        
                        if(speed > 1.0 && !states.includes("Exhaust")) cache.sprite.className = 'sprite-anim running'; else cache.sprite.className = 'sprite-anim';
                        if (states.includes("Exhaust")) { cache.sprite.classList.add('exhausted'); } 

                        let hasBuff = false; let hasDebuff = false;
                        if (states.includes("PaceDown") || states.includes("Exhaust") || states.includes("AuraDebuff")) hasDebuff = true;
                        if (states.includes("Spurt") || states.includes("PaceUp") || states.includes("PaceUpEx") || states.includes("Overtake") || states.includes("AuraBuff")) hasBuff = true;

                        if (hasBuff && !hasDebuff) cache.aura.className = 'energy-aura buff';
                        else if (hasDebuff && !hasBuff) cache.aura.className = 'energy-aura debuff';
                        else if (hasBuff && hasDebuff) cache.aura.className = 'energy-aura buff debuff-mix'; 
                        else cache.aura.className = 'energy-aura';
                    }
                    
                    if (states && states.length > 0) {
                        states.forEach(st => {
                            if (st.startsWith("POPUP|")) {
                                let parts = st.split("|");
                                let pType = parts[1]; let pSeq = parseInt(parts[2]);
                                let uniqueKey = `POPUP-${id}-${pType}-${pSeq}-${frameIdx}`;
                                
                                if (!triggeredSkillsLog.has(uniqueKey)) {
                                    triggeredSkillsLog.set(uniqueKey, timeTarget);
                                    if (cache) {
                                        cache.popupQueue.push({ type: pType, seq: pSeq });
                                        processPopupQueue(id);
                                    }
                                }
                            }
                            else if (st.startsWith("SKILL|")) {
                                let parts = st.split("|");
                                let sName = parts[1]; let sIcon = parts[2];
                                let uniqueKey = `${id}-${sName}`;
                                let lastTriggerTime = triggeredSkillsLog.get(uniqueKey) || -999;
                                
                                if (timeTarget - lastTriggerTime > 1.5) {
                                    triggeredSkillsLog.set(uniqueKey, timeTarget);
                                    if(cache && cache.nameTag) spawnSkillLog(cache.nameTag.innerText, sName, sIcon);
                                }
                            }
                            else if (st.startsWith("ULT|")) {
                                let parts = st.split("|");
                                let ultName = parts[1]; let voiceFile = parts[2];
                                let uniqueKey = `ULT-${id}-${ultName}`;
                                
                                if (!triggeredSkillsLog.has(uniqueKey)) {
                                    triggeredSkillsLog.set(uniqueKey, timeTarget);
                                    if(cache && cache.nameTag) spawnSkillLog(cache.nameTag.innerText, ultName, '고유.png');
                                    triggerUltimate(id, ultName, voiceFile);
                                }
                            }
                        });
                    }
                });

                let sorted = [...runnerPositions].sort((a, b) => b.dist - a.dist);
                if (sorted.length > 0) {
                    let leaderPct = Math.min(100, Math.max(0, (sorted[0].dist / 2000) * 100));
                    document.getElementById('leader-trail').style.width = `${leaderPct}%`;

                    let maxD = sorted[0].dist;
                    let minD = sorted[sorted.length-1].dist;
                    let packCenter = (maxD + minD) / 2;
                    let viewSpread = Math.max(100, (maxD - minD) * 1.5); 

                    sorted.forEach(rPos => {
                        let cache = domCache.get(rPos.id);
                        if (cache) {
                            let relativePct = ((rPos.dist - packCenter) / viewSpread) * 100 + 50;
                            relativePct = Math.max(0, Math.min(100, relativePct));
                            cache.dot.style.left = `${relativePct}%`;
                        }
                    });
                }

                let cDist = Math.floor(leaderDist / 100) * 100;
                if (cDist >= 200 && !window.commentaryLog.has(cDist)) {
                    window.commentaryLog.add(cDist);
                    if (cDist === 400) postCommentary("1코너를 돌아 백 스트레치로 향합니다!");
                    else if (cDist === 900) postCommentary("레이스 중반! 주자들이 자리싸움을 벌입니다.");
                    else if (cDist === 1300) postCommentary("3코너 돌입! 이제 승부의 윤곽이 드러나기 시작합니다!", true);
                    else if (cDist === 1500) postCommentary("최종 직선 구간! 라스트 스퍼트가 시작됩니다!!", true);
                    else if (cDist === 1800) postCommentary("남은 거리 200미터! 결승선이 코앞입니다!");
                    
                    if (sorted.length > 2 && cDist < 1500 && cDist > 500) {
                        if (sorted[0].dist - sorted[1].dist > 15) postCommentary("선두가 크게 격차를 벌리며 도망칩니다!");
                        else if (sorted[0].dist - sorted[sorted.length-1].dist < 20) postCommentary("대형 마군 형성! 한 치 앞을 알 수 없는 혼전입니다.");
                    }
                }

                if (leaderDist >= 2000 && !window.hasAnnouncedFinish) {
                    window.hasAnnouncedFinish = true;
                    postCommentary(`🏁 선두 결승선 통과!`, true);
                }

                let centerPos = getTrackCoordinates(leaderDist);
                let leaderWorldX = centerPos.x * VISUAL_SCALE + CX + Math.cos(centerPos.angle + Math.PI/2) * (LANE_SCALE * 0.75);
                let leaderWorldY = centerPos.y * VISUAL_SCALE + CY + Math.sin(centerPos.angle + Math.PI/2) * (LANE_SCALE * 0.75);

                if (smoothCenterX === 0) { smoothCenterX = leaderWorldX; smoothCenterY = leaderWorldY; }
                smoothCenterX += (leaderWorldX - smoothCenterX) * 0.05; 
                smoothCenterY += (leaderWorldY - smoothCenterY) * 0.05;
                
                let d = leaderDist; 
                let bCamId = "2"; let statusText = "";
                
                if (d <= 200) { bCamId = "2"; statusText = "🎥 [카메라 2] 출발 직선 뷰"; }
                else if (d <= 400) { bCamId = "3"; statusText = "🎥 [카메라 3] 1코너 진입 뷰"; }
                else if (d <= 950) { bCamId = "4"; statusText = "🎥 [카메라 4] 백 스트레치 뷰"; }
                else if (d <= 1225) { bCamId = "5"; statusText = "🎥 [카메라 5] 3코너 진입 뷰"; }
                else if (d <= 1475) { bCamId = "6"; statusText = "🎥 [카메라 6] 최종 코너 뷰"; }
                else if (d <= 1950) { bCamId = "7"; statusText = "🎥 [카메라 7] 최종 직선 뷰"; }
                else { bCamId = "8"; statusText = "🎥 [카메라 8] 결승선 고정 뷰"; }

                if (baseCamId !== bCamId) {
                    baseCamId = bCamId;
                    baseCamStartTime = timeTarget;
                }

                let newCamId = bCamId;
                if (ultActive && currentPlaybackTime <= ultCamEndTime) {
                    newCamId = "ULT"; statusText = "🎥 [필살기] 셀프 카메라 모드";
                    document.getElementById('ult-edge-effect').style.display = 'block';
                } else {
                    ultActive = false; 
                    document.getElementById('ult-edge-effect').style.display = 'none';
                }

                document.getElementById('camera-status').innerText = statusText;

                let isCut = false;
                if (activeCamId !== newCamId) {
                    isCut = true; activeCamId = newCamId; 
                    if (newCamId === "ULT" || activeCamId === "ULT") camStartTime = timeTarget; 
                }

                let elapsed = timeTarget - baseCamStartTime; 
                let t = 0; let e = 0;
                
                let conf = CAM_SETTINGS[activeCamId];
                if (activeCamId === "4") {
                    t = Math.min(1.0, elapsed / 24.0); e = easeIn(t);
                    
                    let focusX = smoothCenterX;
                    let focusY = smoothCenterY;
                    let targetZoom = conf.zoom;

                    if (t < 0.7) {
                        let scanT = t / 0.7; 
                        let floatIdx = scanT * (sorted.length - 1);
                        let idx1 = Math.floor(floatIdx); let idx2 = Math.ceil(floatIdx);
                        let w = floatIdx - idx1; 
                        let r1 = sorted[idx1]; let r2 = sorted[idx2];
                        if (r1 && r2) {
                            focusX = r1.worldX * (1 - w) + r2.worldX * w;
                            focusY = r1.worldY * (1 - w) + r2.worldY * w;
                        }
                    } else {
                        let topCount = Math.min(4, sorted.length);
                        let sumX = 0, sumY = 0;
                        for(let i = 0; i < topCount; i++) { sumX += sorted[i].worldX; sumY += sorted[i].worldY; }
                        let avgX = sumX / topCount; let avgY = sumY / topCount;
                        let backT = (t - 0.7) / 0.3; let backE = easeOut(backT); 
                        let lastR = sorted[sorted.length - 1];
                        focusX = lastR.worldX * (1 - backE) + avgX * backE;
                        focusY = lastR.worldY * (1 - backE) + avgY * backE;
                        targetZoom = conf.zoom - (1.3 * backE);
                    }

                    targetCam.rotX = conf.rotX; 
                    targetCam.zoom = targetZoom;
                    targetCam.rotZ = conf.rotZ + (60 - conf.rotZ) * e;
                    targetCam.x = -focusX + conf.offsetX; 
                    targetCam.y = -focusY + conf.offsetY;
                    
                    if (isCut) {
                        currentCam.x = targetCam.x; currentCam.y = targetCam.y;
                        currentCam.rotX = targetCam.rotX; currentCam.rotZ = targetCam.rotZ; currentCam.zoom = targetCam.zoom;
                    } else {
                        currentCam.x += (targetCam.x - currentCam.x) * 0.1; currentCam.y += (targetCam.y - currentCam.y) * 0.1;
                        currentCam.rotX += (targetCam.rotX - currentCam.rotX) * 0.1; currentCam.rotZ += (targetCam.rotZ - currentCam.rotZ) * 0.1;
                        currentCam.zoom += (targetCam.zoom - currentCam.zoom) * 0.1;
                    }
                    
                    document.getElementById('world').style.transform = `scale(${currentCam.zoom}) rotateX(${currentCam.rotX}deg) rotateZ(${currentCam.rotZ}deg) translateX(${currentCam.x}px) translateY(${currentCam.y}px)`;
                } else {
                    applyCamera(activeCamId, isCut, timeTarget, runnerPositions, baseCamStartTime);
                }
            } catch (err) {
                console.error("Frame Rendering Error:", err);
            }
        }

        function showPodium() {
            AUDIO_FX.run.pause();
            AUDIO_FX.whistle.play().catch(e=>{});
            setTimeout(() => { AUDIO_FX.applause.play().catch(e=>{}); }, 1000);
            
            let screen = document.getElementById('podium-screen');
            if(!screen) {
                screen = document.createElement('div');
                screen.id = 'podium-screen';
                screen.innerHTML = `
                    <div class="podium-title">🏆 결 승 전  결 과 🏆</div>
                    <div id="podium-container">
                        <div class="podium-step step-2">2</div>
                        <div class="podium-step step-1">1</div>
                        <div class="podium-step step-3">3</div>
                    </div>
                `;
                document.getElementById('screen-container').appendChild(screen);
            }
            
            let lastFrame = roomData.replay_data[maxFrames - 1].r;
            let sorted = [...lastFrame].sort((a,b) => b[1] - a[1]);
            let container = screen.querySelector('#podium-container');
            
            sorted.forEach((rData, idx) => {
                let id = rData[0];
                let p = roomData.participants.find(pt => String(pt.id) === String(id));
                if (!p) return;
                
                let rDiv = document.createElement('div');
                rDiv.className = 'podium-runner';
                
                let pSkin = p.skin ? (p.skin.startsWith('http') ? p.skin : `assets/skin/${p.skin}`) : 'assets/skin/skin01.png';
                let pHue = p.hue || 0;

                rDiv.innerHTML = `
                    <div class="podium-name">${p.name}</div>
                    <div class="sprite-anim" style="width:256px; height:256px; background-image: url('${pSkin}'); filter: hue-rotate(${pHue}deg);"></div>
                `;
                
                if (idx === 0) {
                    rDiv.style.bottom = '220px'; rDiv.style.left = '50%'; rDiv.style.transform = 'translateX(-50%) scale(0.6)'; rDiv.style.zIndex = '10';
                    rDiv.querySelector('.podium-name').style.border = '2px solid #f1c40f';
                    rDiv.querySelector('.podium-name').style.color = '#f1c40f';
                } else if (idx === 1) {
                    rDiv.style.bottom = '150px'; rDiv.style.left = 'calc(50% - 160px)'; rDiv.style.transform = 'translateX(-50%) scale(0.55)'; rDiv.style.zIndex = '9';
                } else if (idx === 2) {
                    rDiv.style.bottom = '100px'; rDiv.style.left = 'calc(50% + 160px)'; rDiv.style.transform = 'translateX(-50%) scale(0.5)'; rDiv.style.zIndex = '8';
                } else {
                    let isLeft = (idx % 2 === 0);
                    let offsetX = isLeft ? (-300 - Math.random() * 120) : (300 + Math.random() * 120);
                    let ry = 0 + Math.random() * 40; 
                    
                    rDiv.style.bottom = `${ry}px`;
                    rDiv.style.left = `calc(50% + ${offsetX}px)`;
                    rDiv.style.transform = `translateX(-50%) scale(${0.35 + Math.random()*0.1}) ${isLeft ? '' : 'scaleX(-1)'}`;
                    rDiv.style.zIndex = Math.floor(ry);
                    
                    let sprite = rDiv.querySelector('.sprite-anim');
                    sprite.style.transform = `translateY(0px)`; 
                }
                container.appendChild(rDiv);
            });
            screen.style.display = 'flex';
        }

        function renderLoop(timestamp) {
            if (!lastRenderTimestamp) lastRenderTimestamp = timestamp;
            let delta = (timestamp - lastRenderTimestamp) / 1000;
            lastRenderTimestamp = timestamp;
            if (delta > 0.1) delta = 0.1; 
            
            if (!isPlaying) return;

            // 💡 [버그 픽스] isPaused 삭제 완료. 필살기 시간정지만 체크
            if (!isUltPausing) {
                currentPlaybackTime += delta; 
            }
            renderFrameAtTime(currentPlaybackTime); 

            let exactFrame = currentPlaybackTime / DT;
            let frameIdx = Math.floor(exactFrame);
            // 💡 [버그 픽스] 조건이 만족되면 requestAnimationFrame을 호출하지 않고 return으로 종료!
            if (frameIdx >= maxFrames - 2) { 
                isPlaying = false; 
                showPodium();
                return;
            }
            requestAnimationFrame(renderLoop);
        }
    </script>
</body>
