<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>왁마갤 무스메 : 갸샤욘 레이싱</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c3e50; padding: 20px 0; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; overflow-x: hidden; }
        h1 { text-align: center; margin-bottom: 5px; }
        .subtitle { font-size: 18px; color: #ffeb3b; display: block; margin-top: 5px; font-weight: normal; }
        
        #lobby-panel { width: 90%; max-width: 650px; background-color: #fff; color: #000; border-radius: 10px; padding: 30px; box-sizing: border-box; text-align: center; margin-top: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #lobby-panel input { width: 80%; padding: 12px; font-size: 16px; margin: 10px 0; border: 2px solid #ccc; border-radius: 5px; }
        
        #filter-box { display: none; background: #f5f6fa; padding: 15px; border-radius: 8px; margin: 15px 0; max-height: 180px; overflow-y: auto; text-align: left; border: 1px solid #ddd; }
        .filter-badge { display: inline-block; background: #e74c3c; color: white; padding: 5px 10px; margin: 4px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .filter-badge:hover { background: #c0392b; transform: scale(1.05); }
        .filter-badge::after { content: " ✕"; font-size: 10px; margin-left: 5px; color: #ffbd9b; }
        
        #setup-box { display: none; margin-top: 15px; border-top: 2px dashed #ccc; padding-top: 15px; }
        #setup-box label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        #setup-box input[type="datetime-local"] { width: 60%; padding: 10px; font-size: 16px; text-align: center; }

        #countdown-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        #countdown-text { font-size: 80px; font-weight: bold; color: #ffeb3b; text-shadow: 0 0 20px #ff9800; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
        #sync-text { font-size: 16px; color: #00e5ff; margin-top: 10px; }

        #game-scale-wrapper { width: 900px; transform-origin: top center; display: none; flex-direction: column; align-items: center; transition: transform 0.2s; position: relative; }
        
        #minimap-container { width: 100%; height: 60px; background-color: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 10px; margin-bottom: 10px; position: relative; overflow: hidden; cursor: pointer; }
        #minimap-viewport { position: absolute; top: 0; height: 100%; width: 20%; border: 2px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.2); box-sizing: border-box; z-index: 3; pointer-events: none; transition: left 0.1s linear; }
        .minimap-dot { position: absolute; width: 14px; height: 14px; background-color: #fff; border: 2px solid #000; border-radius: 50%; z-index: 5; font-size: 9px; color: black; font-weight: bold; text-align: center; line-height: 12px; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); transition: left 0.1s linear; }
        .skill-active { background-color: #00e5ff !important; box-shadow: 0 0 10px 4px #00e5ff !important; z-index: 6; }
        .ult-active { background-color: #ffeb3b !important; box-shadow: 0 0 15px 5px #ff5722 !important; z-index: 7; transform: scale(1.3); }

        #game-window { position: relative; width: 100%; height: 470px; background-color: #55a630; border: 4px solid #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s; }
        #track { position: absolute; left: 0; top: 0; width: 10000px; height: 100%; background-image: repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255,255,255,0.1) 100px, rgba(255,255,255,0.1) 102px); }
        .start-line { position: absolute; left: 280px; top: 0; bottom: 0; width: 8px; background: repeating-linear-gradient(to bottom, white, white 10px, transparent 10px, transparent 20px); z-index: 1; }
        .obstacle-zone { position: absolute; height: 100%; background-color: rgba(255, 0, 0, 0.2); z-index: 0; border-left: 2px dashed red; border-right: 2px dashed red; }
        .obstacle-label { position: absolute; top: 10px; color: #ff5555; font-weight: bold; font-size: 20px; z-index: 1; text-shadow: 1px 1px 2px black; }
        .finish-line { position: absolute; top: 0; bottom: 0; width: 20px; background: repeating-linear-gradient(to bottom, white, white 20px, black 20px, black 40px); z-index: 1; }
        .zone-label { position: absolute; top: 0; bottom: 0; color: rgba(255,255,255,0.8); font-size: 24px; font-weight: bold; padding: 10px; box-sizing: border-box; display: flex; align-items: flex-end; padding-bottom: 30px; text-shadow: 2px 2px 4px #000; z-index: 0; }
        
        .runner-container { position: absolute; width: 50px; height: 50px; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        .runner-name-tag { font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 4px; position: absolute; top: -15px; white-space: nowrap; z-index: 4; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .runner-sprite { width: 100%; height: 100%; background-image: url('runner.png'); background-size: contain; background-repeat: no-repeat; background-position: bottom center; z-index: 3; transition: filter 0.2s; }
        
        @keyframes runWiggle { 0% { transform: translateY(0px) rotate(-12deg); } 100% { transform: translateY(-8px) rotate(12deg); } }
        @keyframes bodyCheckShake { 0% { transform: translateX(-2px) translateY(-2px); } 50% { transform: translateX(2px) translateY(2px); } 100% { transform: translateX(-2px) translateY(-2px); } }
        .struggling { animation: bodyCheckShake 0.1s infinite !important; }

        .stamina-bar-bg { position: absolute; bottom: -8px; width: 80%; height: 5px; background-color: #333; border-radius: 3px; overflow: hidden; border: 1px solid #fff; z-index: 4; }
        .stamina-bar-fill { width: 100%; height: 100%; background-color: #00ff00; transition: width 0.1s linear, background-color 0.2s; }
        .stunned-sprite { filter: grayscale(100%) brightness(50%) !important; animation-play-state: paused !important; transform: rotate(-20deg) translateY(10px) !important; }
        .immune-sprite { opacity: 0.5; }

        .burger-item { position: absolute; width: 35px; height: 35px; background-image: url('burger.png'); background-size: cover; z-index: 3; pointer-events: none; opacity: 0; }
        @keyframes dropFromSky { 0% { transform: translateY(-500px) scale(0.5); opacity: 0; } 1% { opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        .falling { animation: dropFromSky 1.5s ease-in forwards; animation-fill-mode: both; }

        .cutin { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #ult-cutin { background: rgba(50,0,0,0.8); }
        #ult-cutin-bg { width: 100%; background: linear-gradient(90deg, transparent, #e53935, transparent); padding: 40px 0; border-top: 2px solid #ffeb3b; border-bottom: 2px solid #ffeb3b; }
        .cutin-title { font-size: 30px; font-weight: bold; color: white; text-shadow: 2px 2px 4px #000; margin-bottom: 10px; }
        .cutin-name { font-size: 45px; font-weight: 900; color: #ffe082; text-shadow: 3px 3px 5px #000; }

        #victory-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; justify-content: center; align-items: center; text-align: center; animation: fadeIn 1s ease-in; }
        #victory-image { width: 250px; margin-bottom: 10px; filter: drop-shadow(0 0 15px #ffeb3b); animation: floatUp 2s infinite alternate ease-in-out; }
        #victory-name { font-size: 60px; font-weight: 900; color: #ffeb3b; text-shadow: 3px 3px 5px #000, 0 0 20px #ff9800; margin-bottom: 10px; }
        #victory-text { font-size: 24px; color: white; font-weight: bold; margin-bottom: 30px; }
        .reload-btn { background-color: #e53935; }
        .reload-btn:hover { background-color: #c62828; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes floatUp { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }

        #audience-layer { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; z-index: 8; background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='60'%3E%3Cpath d='M0,60 C10,30 30,30 40,60 M30,60 C40,20 60,20 70,60 M60,60 C70,35 90,35 100,60 M90,60 C100,25 120,25 130,60 M120,60 C130,30 150,30 160,60' fill='rgba(0,0,0,0.5)'/%3E%3Ccircle cx='20' cy='35' r='7' fill='rgba(0,0,0,0.5)'/%3E%3Ccircle cx='50' cy='25' r='8' fill='rgba(0,0,0,0.5)'/%3E%3Ccircle cx='80' cy='40' r='7' fill='rgba(0,0,0,0.5)'/%3E%3Ccircle cx='110' cy='30' r='8' fill='rgba(0,0,0,0.5)'/%3E%3Ccircle cx='140' cy='35' r='7' fill='rgba(0,0,0,0.5)'/%3E%3Cpath d='M-10,60 C0,40 20,40 30,60 M20,60 C30,35 50,35 60,60 M50,60 C60,45 80,45 90,60 M80,60 C90,30 110,30 120,60 M110,60 C120,40 140,40 150,60 M140,60 C150,35 170,35 180,60' fill='rgba(0,0,0,0.8)'/%3E%3Ccircle cx='10' cy='45' r='8' fill='rgba(0,0,0,0.8)'/%3E%3Ccircle cx='40' cy='40' r='7' fill='rgba(0,0,0,0.8)'/%3E%3Ccircle cx='70' cy='50' r='8' fill='rgba(0,0,0,0.8)'/%3E%3Ccircle cx='100' cy='35' r='8' fill='rgba(0,0,0,0.8)'/%3E%3Ccircle cx='130' cy='45' r='7' fill='rgba(0,0,0,0.8)'/%3E%3Ccircle cx='160' cy='40' r='8' fill='rgba(0,0,0,0.8)'/%3E%3C/svg%3E"); pointer-events: none; }
        
        .chat-bubble { position: absolute; bottom: 65px; background: rgba(255, 255, 255, 0.95); color: #000; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; white-space: nowrap; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); z-index: 9; animation: floatUpChat 3s ease-out forwards; pointer-events: none; transform: translateX(-50%); }
        .chat-bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 6px 0; border-style: solid; border-color: rgba(255, 255, 255, 0.95) transparent transparent transparent; display: block; width: 0; }
        @keyframes floatUpChat { 0% { bottom: 60px; scale: 0.5; opacity: 0; } 15% { bottom: 75px; scale: 1.1; opacity: 1; } 30% { bottom: 80px; scale: 1; opacity: 1; } 80% { bottom: 100px; scale: 1; opacity: 0.8; } 100% { bottom: 110px; scale: 0.8; opacity: 0; } }

        #commentary-board { width: 100%; height: 90px; background-color: #fff; color: #000; border: 3px solid #333; border-radius: 8px; margin-top: 10px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .msg-line { font-size: 13px; color: #888; margin-top: 3px; transition: all 0.3s ease; }
        .msg-line.latest { font-size: 16px; font-weight: bold; color: #000; }
        .msg-line .icon { color: #e53935; }

        #chat-interface { width: 100%; background: #fff; padding: 10px; border-radius: 8px; margin-top: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .chat-macros { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
        .chat-macros button { padding: 6px 12px; font-size: 12px; font-weight: bold; background: #e0e0e0; color: #333; border: 1px solid #ccc; border-radius: 15px; cursor: pointer; transition: 0.2s; }
        .chat-macros button:hover { background: #ffeb3b; }
        .chat-input-row { display: flex; gap: 5px; }
        .chat-input-row input { flex: 1; padding: 8px; border: 2px solid #ccc; border-radius: 5px; font-size: 14px; }
        .chat-input-row button { padding: 8px 15px; background: #3498db; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        .chat-input-row button:hover { background: #2980b9; }

        button { padding: 12px 25px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #ff9800; color: white; border: none; border-radius: 8px; transition: 0.2s; }
        button:hover { background-color: #e68a00; transform: scale(1.05); }
        .btn-blue { background-color: #3498db; }
    </style>
</head>
<body>

    <h1>🍔 왁마갤 무스메 <span class="subtitle">- 갸샤욘 레이싱 -</span></h1>
    
    <div id="lobby-panel">
        <h2>🏆 대회 준비 및 참가자 스크리닝</h2>
        <div id="step-1">
            <input type="text" id="dcUrl" placeholder="디시인사이드 게시글 주소를 입력하세요">
            <br>
            <button onclick="extractParticipants()" id="extractBtn">참가자 먼저 추출하기</button>
        </div>
        
        <div id="filter-box"></div>
        
        <div id="setup-box">
            <div style="margin-bottom: 15px;">
                <label for="mapSelect" style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">🗺️ 개최할 경기장(맵)을 선택하세요</label>
                <select id="mapSelect" style="width: 80%; padding: 10px; font-size: 16px; border: 2px solid #ccc; border-radius: 5px;">
                    <option value="short">🏁 일반 단거리 레이스 (10,000m - 오르막 포함)</option>
                    <option value="long">🏆 극한의 그랜드 더비 (20,000m - 오르막, 징버거 투하)</option>
                </select>
            </div>

            <label for="datetimeInput">⏰ 언제 레이스를 시작할까요? (예약 시간 설정)</label>
            <input type="datetime-local" id="datetimeInput">
            <br><br>
            <button onclick="createRoomFinal()" id="createFinalBtn" class="btn-blue">최종 대회 방 생성하기</button>
        </div>
        
        <div id="lobby-status" style="margin-top: 15px; color: #e53935; font-weight: bold;"></div>
    </div>

    <div id="countdown-overlay">
        <div id="countdown-info">데이터 로딩 완료. 경기 시작 대기 중...</div>
        <div id="countdown-text">00:00</div>
        <div id="sync-text"></div>
    </div>

    <div id="game-scale-wrapper">
        <div id="minimap-container">
            <div id="minimap-viewport"></div>
        </div>

        <div id="game-window">
            <div id="track"></div>
            
            <div id="ult-cutin" class="cutin">
                <div id="ult-cutin-bg">
                    <div class="cutin-title" style="color:#ffeb3b;">🔥 [각성! 갸샤욘의 폭주!] 🔥</div>
                    <div id="ult-user" class="cutin-name" style="color:#fff;">닉네임</div>
                </div>
            </div>

            <div id="audience-layer"></div>

            <div id="victory-overlay">
                <img id="victory-image" src="victory.png" alt="Victory">
                <div id="victory-name">우승자 닉네임</div>
                <div id="victory-text">대회에서 우승을 차지했습니다! 🎉</div>
                <button class="reload-btn" onclick="location.reload()">처음으로 돌아가기</button>
            </div>
        </div>

        <div id="commentary-board">
            <div class="msg-line latest"><span class="icon">▶</span> 선수들 게이트 진입 대기 중...</div>
        </div>

        <div id="chat-interface">
            <div class="chat-macros">
                <button onclick="sendChat('샤욘아!')">샤욘아!</button>
                <button onclick="sendChat('ㅠㅠ')">ㅠㅠ</button>
                <button onclick="sendChat('ㅅㅅ')">ㅅㅅ</button>
                <button onclick="sendChat('ㅅㅂ')">ㅅㅂ</button>
                <button onclick="sendChat('ㅂㅅ')">ㅂㅅ</button>
                <button onclick="sendChat('ㅎㅇ')">ㅎㅇ</button>
                <button onclick="sendChat('주작')">주작</button>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="응원 메시지를 입력 (엔터 전송)" onkeypress="if(event.key==='Enter') sendCustomChat()">
                <button onclick="sendCustomChat()">응원하기</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const API_BASE = "https://gonik-musume.onrender.com/api"; 
        
        const firebaseConfig = { databaseURL: "https://wak-derby-chat-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let chatRef = null; 

        // ==============================================
        // 🛠️ [기획자 설정 변수 완벽 세팅]
        // ==============================================
        let TRACK_LENGTH = 10000;    
        let FINISH_LINE = 9600; 
        let OBSTACLE_START = 3500; 
        let OBSTACLE_END = 5000;   

        const BASE_MOVE_SPEED_MULT = 0.045; 
        const BASE_STAMINA_DRAIN = 0.012; // 💡 기본 연비(효율) 향상 (0.020 -> 0.012)
        const ACCEL_MULT = 0.5;             
        
        const ULT_SPEED_BOOST = 1.5;          
        const ULT_ROCKET_BOOST = 1.5;       
        
        const SUPPLY_START = 17000; 
        const SUPPLY_END = 19000;
        let burgers = [];
        let supplyActivated = false;
        
        let currentCameraX = 0; 
        let manualCameraTargetX = -1;
        let manualCameraEndTime = 0;
        
        let clusterViewCount = 0;   
        let leaderWasInZone = false;
        let lastZoneExitTime = 0;   
        let clusterViewEndTime = 0;
        
        let burgerCameraTargetX = 0;
        let burgerCameraEndTime = 0; 
        // ==============================================

        let seededRandom = Math.random; 
        function xmur3(str) {
            for(var i = 0, h = 1779033703 ^ str.length; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19;
            }
            return function() {
                h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0;
            }
        }
        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function resizeGame() {
            const wrapper = document.getElementById('game-scale-wrapper');
            if (wrapper.style.display !== 'none') {
                const scale = Math.min(window.innerWidth / 940, 1);
                wrapper.style.transform = `scale(${scale})`;
            }
        }
        window.addEventListener('resize', resizeGame);

        const TICK_RATE = 60; 
        const TICK_DT = 1.0 / TICK_RATE; 
        const TICK_MS = 1000 / TICK_RATE;
        let accumulator = 0;
        let lastRealTime = 0;
        let gameTime = 0; 

        let roomData = null;
        let runners = [];
        let isRacing = false;
        let isPaused = false;
        let raceEnded = false;
        let isFastForwarding = false; 
        
        let lastSkillTime = -10;
        let ultimateUsed = false;
        let focusRunner = null;
        let focusEndTime = 0;
        let obstacleZoneActivatedAt = -1; 
        let obstacleZoneClearedTime = -1;
        let leaderX = 0;
        let currentLeader = null;
        let bodyCheckCommentaryCd = 0; 
        const MAX_LANES = 8; 
        const strategies = ["도주", "선행", "선입", "추입"];

        function sendCustomChat() {
            const input = document.getElementById('chatInput');
            if (input.value.trim() !== '') {
                sendChat(input.value.trim());
                input.value = '';
            }
        }

        function sendChat(msg) {
            if (chatRef) {
                chatRef.push({ message: msg, timestamp: firebase.database.ServerValue.TIMESTAMP });
            } else {
                spawnChatBubble(msg);
            }
        }

        function spawnChatBubble(msg) {
            const gameWin = document.getElementById('game-window');
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.innerText = msg;
            
            const randomX = 10 + Math.random() * 80; 
            bubble.style.left = `${randomX}%`;
            
            gameWin.appendChild(bubble);
            setTimeout(() => { if(gameWin.contains(bubble)) gameWin.removeChild(bubble); }, 3000);
        }

        let currentExtractedList = [];
        async function extractParticipants() {
            const urlInput = document.getElementById('dcUrl').value;
            const statusDiv = document.getElementById('lobby-status');
            const btn = document.getElementById('extractBtn');

            if (!urlInput.trim()) { statusDiv.innerText = "URL을 입력해주세요."; return; }
            statusDiv.innerText = "디시인사이드 댓글에서 선수 명단을 추출하고 있습니다...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/extract_only`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerText = "";
                    currentExtractedList = data.participants;
                    renderFilterBadges(); 
                    
                    const now = new Date();
                    now.setMinutes(now.getMinutes() + 2);
                    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                    document.getElementById('datetimeInput').value = now.toISOString().slice(0, 16);
                    
                    document.getElementById('filter-box').style.display = 'block';
                    document.getElementById('setup-box').style.display = 'block';
                } else {
                    statusDiv.innerText = "오류: " + data.message;
                }
            } catch (err) {

        function startCountdown() {
            let timer = setInterval(() => {
                const nowUnix = Math.floor(Date.now() / 1000);
                let diff = roomData.scheduled_time - nowUnix;
                
                if (diff <= 0) {
                    clearInterval(timer);
                    document.getElementById('countdown-overlay').style.display = 'none';
                    startRace();
                } else {
                    let m = Math.floor(diff / 60).toString().padStart(2, '0');
                    let s = (diff % 60).toString().padStart(2, '0');
                    document.getElementById('countdown-text').innerText = `${m}:${s}`;
                }
            }, 1000);
            
            const nowUnix = Math.floor(Date.now() / 1000);
            if (nowUnix >= roomData.scheduled_time) {
                clearInterval(timer);
                document.getElementById('sync-text').innerText = "경기가 이미 시작되었습니다. 실시간 동기화 중...";
                setTimeout(startRace, 500); 
            }
        }

        function showCommentary(text) {
            if (isFastForwarding) return; 
            const board = document.getElementById('commentary-board');
            const existing = board.querySelectorAll('.msg-line');
            existing.forEach(el => el.classList.remove('latest'));

        }

        function triggerUltimate(runner) {
            if (isFastForwarding) {
                runner.stats.speed += ULT_SPEED_BOOST; 
                runner.speedBoost = ULT_ROCKET_BOOST; 
                runner.isUltimateActive = true;
                runner.currentStamina += runner.maxStamina * 0.1;
                if (runner.currentStamina > runner.maxStamina) runner.currentStamina = runner.maxStamina;
                if (runner.isExhausted && runner.currentStamina >= runner.maxStamina / 3) runner.isExhausted = false;
                return;
            }

            isPaused = true;
            const cutin = document.getElementById('ult-cutin');
            document.getElementById('ult-user').innerText = runner.name;
            cutin.style.display = 'flex';
            showCommentary(`💥 기적의 스퍼트! 중위권의 ${runner.name}가 궁극기를 발동합니다!!`);

            setTimeout(() => {
                cutin.style.display = 'none';
                isPaused = false;
                
                runner.stats.speed += ULT_SPEED_BOOST; 
                runner.speedBoost = ULT_ROCKET_BOOST; 
                runner.isUltimateActive = true;
                
                runner.currentStamina += runner.maxStamina * 0.1;
                if (runner.currentStamina > runner.maxStamina) runner.currentStamina = runner.maxStamina;
                if (runner.isExhausted && runner.currentStamina >= runner.maxStamina / 3) {
                    runner.isExhausted = false;
                }

                focusRunner = runner;
                focusEndTime = gameTime + 3.0; 
                lastRealTime = Date.now(); 
                requestAnimationFrame(gameLoop); 
            }, 2000); 
        }

        function initRunners() {
            let seedNumber = xmur3(roomData.seed)(); 
            seededRandom = mulberry32(seedNumber);
            runners = [];
            
            roomData.participants.forEach((name, index) => {
                const strategy = strategies[Math.floor(seededRandom() * strategies.length)];
                
                // 💡 [스탯 유도 개편] 근성은 균일하게, 선입/추입은 스태미나와 파워에 극단적 몰빵
                let statWeights = [1, 1, 1, 1, 1];
                if (strategy === "도주") statWeights = [3.0, 0.6, 1.0, 1.0, 1.2]; 
                if (strategy === "선행") statWeights = [1.5, 1.5, 1.5, 1.0, 1.0]; 
                if (strategy === "선입") statWeights = [0.8, 2.5, 2.0, 1.0, 1.0]; 
                if (strategy === "추입") statWeights = [0.5, 2.5, 2.5, 1.0, 1.0]; 

                let baseStats = [40, 40, 40, 40, 40]; 
                let remain = 110; 
                let totalWeight = statWeights.reduce((a, b) => a + b, 0);

                while(remain > 0) {
                    let rand = seededRandom() * totalWeight;
                    let rIdx = 0, sum = 0;
                    for (let i = 0; i < 5; i++) {
                        sum += statWeights[i];
                        if (rand <= sum) { rIdx = i; break; }
                    }
                    if (baseStats[rIdx] < 100) {
                        let add = Math.min(remain, 100 - baseStats[rIdx], Math.floor(seededRandom() * 3) + 1);
                        baseStats[rIdx] += add; remain -= add;
                    }
                }
                
                let conditions = ["최악(x0.9)", "저조(x0.95)", "보통(x1.0)", "양호(x1.05)", "최상(x1.1)"];
                let condIdx = Math.floor(seededRandom() * conditions.length);
                let condMod = 0.9 + (condIdx * 0.05);

                let stats = {
                    speed: baseStats[0] * condMod, stamina: baseStats[1] * condMod,
                    power: baseStats[2] * condMod, guts: baseStats[3] * condMod, intel: baseStats[4] * condMod
                };

                const laneIndex = index % MAX_LANES; 
                const rowIndex = Math.floor(index / MAX_LANES); 
                let startX = 250 - (rowIndex * 70);

                const runnerEl = document.createElement('div');
                runnerEl.className = 'runner-container';
                runnerEl.style.top = `${20 + (laneIndex * 52)}px`;

                const nameTag = document.createElement('div');
                nameTag.className = 'runner-name-tag';
                nameTag.innerText = name;
                runnerEl.appendChild(nameTag);

                const sprite = document.createElement('div');
                sprite.className = 'runner-sprite';
                const randomHue = Math.floor(seededRandom() * 360);
                sprite.style.filter = `hue-rotate(${randomHue}deg)`;
                
                let animSpeed = 0.5;
                if (strategy === "도주") animSpeed = 0.35;
                if (strategy === "추입") animSpeed = 0.6;
                sprite.style.animation = `runWiggle ${animSpeed}s infinite alternate ease-in-out`;
                runnerEl.appendChild(sprite);

                const staminaBarBg = document.createElement('div');
                staminaBarBg.className = 'stamina-bar-bg';
                const staminaFill = document.createElement('div');
                staminaFill.className = 'stamina-bar-fill';
                staminaBarBg.appendChild(staminaFill);
                runnerEl.appendChild(staminaBarBg);
                
                document.getElementById('track').appendChild(runnerEl);

                const dotEl = document.createElement('div');
                dotEl.className = 'minimap-dot';
                dotEl.innerText = name.substring(0, 1);
                dotEl.style.top = `${10 + (laneIndex / MAX_LANES) * 80}%`;
                document.getElementById('minimap-container').appendChild(dotEl);

                runners.push({
                    name: name, element: runnerEl, spriteEl: sprite, baseHue: randomHue, staminaFillEl: staminaFill, dotElement: dotEl,
                    x: startX, stats: stats, strategy: strategy, lane: laneIndex, 
                    baseY: 20 + (laneIndex * 52), y: 20 + (laneIndex * 52),
                    speedBoost: 1.0, hasSkill: true, stunnedUntil: 0, immuneUntil: 0, 
                    maxStamina: stats.stamina * 38, currentStamina: stats.stamina * 38, 
                    isNormalSkillActive: false, isUltimateActive: false, finished: false,
                    isExhausted: false, currentSpeed: 0, isStruggling: false,
                    isOverpacing: false, hasExcited: false, isExcited: false, excitedPenalty: false, excitedEndTime: 0,
                    currentSpeedPortion: 0, currentPowerPortion: 0 
                });
            });
            renderFrame(); 
        }

        function startRace() {
            if (isRacing) return;
            document.getElementById('countdown-overlay').style.display = 'none';
            isRacing = true; isPaused = false;
            
            const nowRealUnix = Date.now() / 1000;
            let elapsedSec = nowRealUnix - roomData.scheduled_time;

            if (elapsedSec > 0) {
                isFastForwarding = true;
                let skipLimit = Math.min(elapsedSec, 180);
                while (gameTime < skipLimit && !raceEnded) {
                    updatePhysics(TICK_DT);
                    gameTime += TICK_DT;
                }
                isFastForwarding = false;
            }

            lastRealTime = Date.now();
            showCommentary("🏁 레이스 시작! 갸샤욘들의 숨막히는 대결이 펼쳐집니다.");
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (isPaused) return;
            let now = Date.now();
            let frameTime = now - lastRealTime;
            lastRealTime = now;
            accumulator += frameTime;

            while (accumulator >= TICK_MS && !raceEnded) {
                updatePhysics(TICK_DT);
                accumulator -= TICK_MS;
                gameTime += TICK_DT;
            }
            renderFrame(); 
            if (!raceEnded && !isPaused) requestAnimationFrame(gameLoop);
        }

        function updatePhysics(dt) {
            leaderX = 0;
            currentLeader = null;
            runners.forEach(r => { if (r.x > leaderX) { leaderX = r.x; currentLeader = r; } });

            if (focusRunner && gameTime > focusEndTime) {
                focusRunner = null;
            }

            if (leaderX > OBSTACLE_START && obstacleZoneActivatedAt === -1) {
                obstacleZoneActivatedAt = gameTime;
                showCommentary("🚧 선두 그룹이 덫 지대에 진입했습니다!");
            }
            if (leaderX > OBSTACLE_END && obstacleZoneClearedTime === -1) {
                obstacleZoneClearedTime = gameTime;
                showCommentary("💨 선두 주자가 위험 구간을 무사히 돌파했습니다!");
            }

            if (roomData.map_type === 'long' && !supplyActivated && leaderX >= SUPPLY_START) {
                supplyActivated = true;
                showCommentary("🛩️ 선두가 보급 구역 진입! 곧 징버거 보급이 투하됩니다!");
                
                burgerCameraTargetX = leaderX + 400; 
                burgerCameraEndTime = gameTime + 4.0;
                
                const trackEl = document.getElementById('track');
                for (let i = 0; i < 7; i++) { 
                    let bx = leaderX + 100 + (seededRandom() * 800); 
                    let randomLane = Math.floor(seededRandom() * MAX_LANES);
                    let by = 20 + (randomLane * 52); 
                    let dropDelay = 1.5 + (seededRandom() * 2.0); 
                    
                    let bEl = document.createElement('div');
                    bEl.className = 'burger-item falling';
                    bEl.style.left = `${bx}px`;
                    bEl.style.top = `${by}px`;
                    bEl.style.animationDelay = `${dropDelay}s`;
                    
                    trackEl.appendChild(bEl);
                    
                    burgers.push({
                        x: bx, y: by, el: bEl, active: false, consumed: false,
                        activateTime: gameTime + dropDelay + 0.5 
                    });
                }
            }

            if (!ultimateUsed && leaderX > FINISH_LINE * 0.75) {
                let sortedRunners = [...runners].sort((a, b) => b.x - a.x);
                let eligibleRunners = sortedRunners.slice(1).filter(r => r.x > 100);
                if (eligibleRunners.length > 0) {
                    ultimateUsed = true;
                    let N = eligibleRunners.length;
                    let weights = eligibleRunners.map((r, i) => Math.sin(Math.PI * (i + 1) / (N + 1)));
                    let totalWeight = weights.reduce((a, b) => a + b, 0);
                    let randomVal = seededRandom() * totalWeight;
                    let sum = 0;
                    let luckyRunner = eligibleRunners[0]; 
                    for (let i = 0; i < N; i++) {
                        sum += weights[i];
                        if (randomVal <= sum) { luckyRunner = eligibleRunners[i]; break; }
                    }
                    triggerUltimate(luckyRunner);
                    if(isFastForwarding) return; 
                    else return; 
                }
            }

            let isCloseRace = false;
            let sorted = [...runners].sort((a,b) => b.x - a.x);
            if (sorted.length >= 2 && (sorted[0].x - sorted[1].x) < 180) { isCloseRace = true; }
            
            let physicsDt = dt;
            if (leaderX > FINISH_LINE - 400 && leaderX < FINISH_LINE && isCloseRace) {
                physicsDt = dt * 0.25; 
            }

            runners.forEach(runner => {
                if (runner.finished) return;

                if (roomData.map_type === 'long' && supplyActivated && runner.x >= SUPPLY_START - 100 && runner.x <= SUPPLY_END) {
                    burgers.forEach(burger => {
                        if (!burger.consumed && gameTime > burger.activateTime) {
                            let distX = Math.abs(runner.x - burger.x);
                            let distY = Math.abs(runner.y - burger.y);
                            
                            if (distX < 50 && distY < 45) { 
                                burger.consumed = true;
                                burger.el.remove(); 
                                
                                runner.currentStamina += runner.maxStamina * 0.3;
                                if (runner.currentStamina > runner.maxStamina) runner.currentStamina = runner.maxStamina;
                                if (runner.isExhausted && runner.currentStamina >= runner.maxStamina / 3) runner.isExhausted = false;
                                
                                if(!isFastForwarding) showCommentary(`🍔 뇸뇸! [${runner.name}] 버거 획득! 체력을 30% 회복합니다!`);
                            }
                        }
                    });
                }

                let terrainSpeedMult = 1.0;
                let terrainStaminaMult = 1.0;
                runner.y = runner.baseY; 
                runner.lane = Math.floor((runner.y - 20) / 52);

                if (roomData.map_type === 'long') {
                    if (runner.x >= 10000 && runner.x < 12000) { 
                        terrainSpeedMult = 0.6 + (runner.stats.power / 100) * 0.4; 
                        terrainStaminaMult = 1.5; 
                    } 
                } else {
                    if (runner.x >= 7000 && runner.x < 8800) {
                        terrainSpeedMult = 0.65 + (runner.stats.power / 100) * 0.35;
                        terrainStaminaMult = 1.4;
                    }
                }

                runner.isOverpacing = false;
                let trackPercent = runner.x / FINISH_LINE;
                
                if (gameTime > 3.0 && runner.strategy === "도주" && trackPercent >= 0.05 && trackPercent <= 0.35) {
                    let nearbyDoju = runners.find(other => 
                        other !== runner && 
                        other.strategy === "도주" && 
                        Math.abs(runner.x - other.x) < 150 && 
                        Math.abs(runner.lane - other.lane) <= 1
                    );
                    if (nearbyDoju) runner.isOverpacing = true;
                }
                if (runner.isOverpacing && gameTime > bodyCheckCommentaryCd && seededRandom() < 0.05) {
                    showCommentary(`🔥 도주마들의 치열한 선두 경쟁! 오버페이스로 스태미나가 타들어갑니다!`);
                    bodyCheckCommentaryCd = gameTime + 5.0; 
                }

                if (gameTime > 5.0 && !runner.hasExcited && trackPercent < 0.4 && seededRandom() < 0.001) {
                    if (runner.strategy === "선입" || runner.strategy === "추입") {
                        let exciteChance = (100 - runner.stats.intel) / 100; 
                        if (seededRandom() < exciteChance) {
                            runner.hasExcited = true;
                            runner.isExcited = true;
                            runner.excitedEndTime = gameTime + 5.0; 
                            showCommentary(`💢 [${runner.name}] 흥분 상태! 통제를 잃고 무리하게 질주합니다!`);
                        }
                    }
                }
                if (runner.isExcited && gameTime > runner.excitedEndTime) {
                    runner.isExcited = false;
                    runner.excitedPenalty = true;
                    showCommentary(`💦 무리한 질주의 대가인가요? [${runner.name}] 급격히 체력이 빠집니다!`);
                }

                runner.isStruggling = false;
                let auraDebuff = 1.0;

                if (gameTime > 5.0 && !runner.isExhausted) {
                    runners.forEach(other => {
                        if (runner !== other && !other.finished) {
                            let distanceX = Math.abs(runner.x - other.x);
                            let distanceLane = Math.abs(runner.lane - other.lane);
                            
                            if (distanceX < 60 && distanceLane <= 1) {
                                if (runner.stats.power < other.stats.power) {
                                    let escapeChance = runner.stats.intel / 150; 
                                    if (seededRandom() > escapeChance) {
                                        let powerDiff = other.stats.power - runner.stats.power;
                                        let penalty = (powerDiff / 50) * 0.5 * (1 - (distanceX / 60));
                                        let intelMitigation = (runner.stats.intel / 100) * 0.5;
                                        penalty *= (1 - intelMitigation);
                                        auraDebuff -= penalty;
                                    } else {
                                        if (gameTime > bodyCheckCommentaryCd && seededRandom() < 0.05) {
                                            showCommentary(`🧠 [${runner.name}] 마군에 갇혔지만 영리하게 빈틈을 파고듭니다!`);
                                            bodyCheckCommentaryCd = gameTime + 5.0; 
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
                
                auraDebuff = Math.max(0.5, auraDebuff);
                if (auraDebuff < 0.95) runner.isStruggling = true; 
                
                let bodyCheckStaminaMult = 1.0 + ((1.0 - auraDebuff) * 1.5);

                if (runner.x > OBSTACLE_START && runner.x < OBSTACLE_END) {
                    let isInStun = (gameTime < runner.stunnedUntil);
                    let isImmune = (gameTime < runner.immuneUntil);
                    if (!isInStun && !isImmune) {
                        let timeSinceActive = gameTime - obstacleZoneActivatedAt;
                        let baseTrapChance = 0.025 * Math.max(0, 1 - (timeSinceActive / 10.0));
                        if (seededRandom() < baseTrapChance) {
                            let evadeChance = (runner.stats.intel / 100) * 0.5; 
                            if (runner === currentLeader) evadeChance = -0.3; 
                            if (seededRandom() > evadeChance) {
                                let stunDur = (800 - (runner.stats.power * 2)) / 1000.0;
                                if(stunDur < 0.3) stunDur = 0.3;
                                runner.stunnedUntil = gameTime + stunDur;
                                runner.immuneUntil = runner.stunnedUntil + 1.5; 
                                if(runner === currentLeader) showCommentary(`🚨 선두 ${runner.name}, 덫에 걸려 넘어졌습니다!!`);
                            }
                        }
                    }
                }
                
                if (gameTime < runner.stunnedUntil) {
                    runner.currentSpeedPortion = 0; 
                    runner.currentPowerPortion = 0;
                    runner.currentSpeed = 0; 
                    return; 
                }

                let skillDisabled = (leaderX > FINISH_LINE * 0.85) || !(runner.x > FINISH_LINE * 0.20) || (runner === currentLeader);
                let isGlobalCooldown = (gameTime - lastSkillTime < 5.0);
                let skillProb = 0.005 + (runner.stats.intel / 1000); 

                if (runner.hasSkill && !skillDisabled && !isGlobalCooldown && seededRandom() < skillProb) {
                    runner.hasSkill = false;
                    lastSkillTime = gameTime;
                    runner.speedBoost = 2.0;
                    runner.isNormalSkillActive = true;
                    showCommentary(`💡 [스킬] ${runner.name} 선수가 가속합니다!`);
                }

                let strategyMultiplier = 1.0;
                if (runner.strategy === "도주" && trackPercent < 0.3) strategyMultiplier = 1.20;
                if (runner.strategy === "선행" && trackPercent > 0.15 && trackPercent < 0.5) strategyMultiplier = 1.15;
                if (runner.strategy === "선입" && trackPercent > 0.4 && trackPercent < 0.75) strategyMultiplier = 1.15;
                if (runner.strategy === "추입" && trackPercent > 0.7) strategyMultiplier = 1.25;

                let staminaDrainMult = runner.isUltimateActive ? 0.8 : 1.0;
                if (runner.isOverpacing) staminaDrainMult *= 1.8; 
                if (runner.isExcited) staminaDrainMult *= 3.0; // 💡 흥분 페널티 대폭 상향 (1.5 -> 3.0)
                if (runner.excitedPenalty) staminaDrainMult *= 1.2; 

                let catchUpMod = 1.0;
                let distanceToLeader = leaderX - runner.x;
                if (distanceToLeader > 300) {
                    catchUpMod = 1.0 + Math.min(0.25, distanceToLeader / 4000); 
                }

                if (runner.isExhausted) {
                    // 💡 [패치] 스태미나 스탯(최대 체력)이 높을수록 회복에 시간이 더 걸리는 고정 수치 회복 방식
                    let baseRecovery = 4.0; 
                    if (runner.excitedPenalty) baseRecovery *= 0.5; 

                    runner.currentStamina += baseRecovery * (physicsDt * 60);

                    if (runner.currentStamina >= runner.maxStamina / 3) {
                        runner.currentStamina = runner.maxStamina / 3;
                        runner.isExhausted = false;
                    }
                } else {
                    // 💡 [패치] 근성(guts) 스탯이 높을수록 스태미나 소모량이 대폭 감소 (효율 증가)
                    let gutsEfficiency = 1.0 - (runner.stats.guts / 250); // 근성 100일 경우 소모량 40% 감소
                    
                    runner.currentStamina -= (runner.stats.speed * BASE_STAMINA_DRAIN) * strategyMultiplier * staminaDrainMult * terrainStaminaMult * bodyCheckStaminaMult * gutsEfficiency * (physicsDt * 60); 
                    if (runner.currentStamina <= 0) {
                        runner.currentStamina = 0;
                        runner.isExhausted = true;
                        if (runner === currentLeader) showCommentary(`💦 헉헉.. 선두 [${runner.name}] 스태미나 고갈! 페이스가 떨어집니다.`);
                    }
                }

                let staminaMod = runner.isExhausted ? 0.4 : 1.0; 
                let eventSpeedMult = runner.isExcited ? 1.3 : 1.0; 
                
                let globalMult = strategyMultiplier * staminaMod * catchUpMod * terrainSpeedMult * eventSpeedMult * auraDebuff;
                
                let ultPowerMult = runner.isUltimateActive ? 1.5 : 1.0; 

                let targetSpeedPortion = (runner.stats.speed / 100) * 2.2 * globalMult;
                let targetPowerPortion = (runner.stats.power / 100) * 3.3 * globalMult * ultPowerMult;

                let speedRate = 0.20; 
                runner.currentSpeedPortion += (targetSpeedPortion - runner.currentSpeedPortion) * speedRate * (physicsDt * 60);

                let powerRate = targetPowerPortion > runner.currentPowerPortion ? 0.005 : 0.05;
                runner.currentPowerPortion += (targetPowerPortion - runner.currentPowerPortion) * powerRate * (physicsDt * 60);

                if (isNaN(runner.currentSpeedPortion)) runner.currentSpeedPortion = 0;
                if (isNaN(runner.currentPowerPortion)) runner.currentPowerPortion = 0;

                runner.currentSpeed = runner.currentSpeedPortion + runner.currentPowerPortion;
                if (runner.currentSpeed < 0) runner.currentSpeed = 0;

                if (runner.speedBoost > 1.0) runner.speedBoost -= 0.015 * (physicsDt * 60); 
                else { runner.speedBoost = 1.0; runner.isNormalSkillActive = false; }

                let finalMoveAmount = runner.currentSpeed * runner.speedBoost;
                if (isNaN(finalMoveAmount)) finalMoveAmount = 1.0; 
                
                runner.x += finalMoveAmount * (physicsDt * 60);

                if (runner.x >= FINISH_LINE && !raceEnded) {
                    raceEnded = true;
                    runner.finished = true;
                    showCommentary(`🏆 우승 쟁취! [${runner.name}] 결승선을 가장 먼저 통과합니다!!`);
                    
                    if (!isFastForwarding) {
                        setTimeout(() => {
                            document.getElementById('victory-name').innerText = runner.name;
                            document.getElementById('victory-overlay').style.display = 'flex';
                        }, 1500);
                    }
                }
            });
        }

        function renderFrame() {
            if (isFastForwarding) return; 

            const gameWin = document.getElementById('game-window');
            let isCloseRace = false;
            let sorted = [...runners].sort((a,b) => b.x - a.x);
            if (sorted.length >= 2 && (sorted[0].x - sorted[1].x) < 180) { isCloseRace = true; }

            let currentTransform = "scale(1)";
            if (!raceEnded && leaderX > FINISH_LINE - 400 && leaderX < FINISH_LINE && isCloseRace) {
                currentTransform = "scale(1.15)"; 
                gameWin.style.filter = "contrast(1.1) brightness(0.95)"; 
            } else {
                gameWin.style.filter = "none";
                if (roomData.map_type === 'long') {
                    if (leaderX >= 10000 && leaderX < 12000) currentTransform = "scale(1) rotate(-3deg)";
                } else {
                    if (leaderX >= 7000 && leaderX < 8800) currentTransform = "scale(1) rotate(-3deg)";
                }
            }
            gameWin.style.transform = currentTransform;

            runners.forEach(runner => {
                if(!isNaN(runner.x)) runner.element.style.left = runner.x + 'px';
                if(!isNaN(runner.y)) runner.element.style.top = runner.y + 'px';
                
                let staminaPercent = Math.max(0, (runner.currentStamina / runner.maxStamina) * 100);
                runner.staminaFillEl.style.width = staminaPercent + '%';
                
                if (runner.isExhausted) {
                    runner.staminaFillEl.style.backgroundColor = '#ff5555';
                } else {
                    runner.staminaFillEl.style.backgroundColor = '#00ff00';
                }

                let isStunned = (gameTime < runner.stunnedUntil);
                
                if (isStunned) {
                    runner.spriteEl.className = 'runner-sprite stunned-sprite';
                    runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg) grayscale(100%) brightness(50%)`;
                } else if (runner.finished) {
                    runner.spriteEl.className = 'runner-sprite';
                    runner.spriteEl.style.animationPlayState = 'paused';
                    runner.spriteEl.style.transform = 'rotate(0deg) translateY(0px)';
                } else {
                    let spriteClass = 'runner-sprite running';
                    if (runner.isStruggling) spriteClass += ' struggling';
                    runner.spriteEl.className = spriteClass;
                    
                    runner.spriteEl.style.animationPlayState = 'running';
                    
                    if (runner.isUltimateActive) {
                        runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg) drop-shadow(0 0 10px #ffeb3b) brightness(1.2)`;
                    } else if (runner.isExcited) {
                        runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg) drop-shadow(0 0 8px red) brightness(1.5)`;
                    } else if (runner.isOverpacing) {
                        runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg) drop-shadow(0 0 5px orange)`;
                    } else if (runner.isExhausted) {
                        runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg) brightness(0.8) sepia(0.5)`;
                    } else {
                        runner.spriteEl.style.filter = `hue-rotate(${runner.baseHue}deg)`;
                    }
                }
                
                if (gameTime < runner.immuneUntil && gameTime >= runner.stunnedUntil) runner.spriteEl.classList.add('immune-sprite');

                let minimapPercent = Math.max(0, Math.min((runner.x / TRACK_LENGTH) * 100, 100));
                if(!isNaN(minimapPercent)) runner.dotElement.style.left = `calc(${minimapPercent}% - 7px)`;
                if(!isNaN(runner.y)) runner.dotElement.style.top = `${ (runner.y / 470) * 100 }%`;
                
                if (runner.isUltimateActive) runner.dotElement.className = 'minimap-dot ult-active';
                else if (runner.isNormalSkillActive) runner.dotElement.className = 'minimap-dot skill-active';
                else runner.dotElement.className = 'minimap-dot';
            });

            let targetCameraX = leaderX;
            let prepDist = 250; 
            let leaderInZone = false;
            
            let zones = roomData.map_type === 'long' 
                ? [{s: 6000, e: 7000}, {s: 10000, e: 12000}, {s: 17000, e: 19000}]
                : [{s: 3500, e: 4500}, {s: 7000, e: 8800}];

            zones.forEach(z => {
                if (leaderX >= z.s - prepDist && leaderX <= z.e) leaderInZone = true;
            });

            if (leaderWasInZone && !leaderInZone) {
                clusterViewCount = 0;
                lastZoneExitTime = gameTime;
            }
            leaderWasInZone = leaderInZone;

            let clusterX = leaderX;
            let maxClusterSize = 0;
            for (let i = 0; i < runners.length; i++) {
                let count = 0;
                for (let j = 0; j < runners.length; j++) {
                    if (Math.abs(runners[i].x - runners[j].x) < 200) count++;
                }
                if (count > maxClusterSize) {
                    maxClusterSize = count;
                    clusterX = runners[i].x;
                }
            }

            if (clusterViewEndTime > 0 && gameTime > clusterViewEndTime) {
                clusterViewEndTime = 0; 
            }
            
            if (!leaderInZone && gameTime > lastZoneExitTime + 10.0 && clusterViewCount < 1 && clusterViewEndTime === 0 && gameTime > burgerCameraEndTime) {
                if (maxClusterSize >= 3 && clusterX < leaderX - 400) {
                    clusterViewCount++;
                    clusterViewEndTime = gameTime + 5.0;
                    if (!isFastForwarding) showCommentary(`🎥 카메라가 치열한 중위권 다툼을 포착합니다!`);
                }
            }

            if (gameTime < manualCameraEndTime) {
                targetCameraX = manualCameraTargetX; 
            } else if (gameTime < burgerCameraEndTime) {
                targetCameraX = burgerCameraTargetX; 
            } else if (focusRunner) {
                targetCameraX = focusRunner.x; 
            } else if (leaderInZone) {
                targetCameraX = leaderX; 
            } else if (clusterViewEndTime > 0) {
                targetCameraX = clusterX; 
            } else {
                targetCameraX = leaderX; 
            }

            if (currentCameraX === 0 || isNaN(currentCameraX)) currentCameraX = leaderX; 
            if (!isNaN(targetCameraX)) currentCameraX += (targetCameraX - currentCameraX) * 0.05; 

            let trackLeftOffset = Math.max(0, currentCameraX - 600);
            if (trackLeftOffset > TRACK_LENGTH - 900) trackLeftOffset = TRACK_LENGTH - 900;
            
            document.getElementById('track').style.left = -trackLeftOffset + 'px';
            document.getElementById('minimap-viewport').style.left = `${(trackLeftOffset / TRACK_LENGTH) * 100}%`;
        }
    </script>
